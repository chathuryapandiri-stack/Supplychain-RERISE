s)\", showgrid=True, gridcolor=\"#21262D\", range=[0, max(8, scenario.duration_days + 2)]),\n        yaxis=dict(showgrid=False),\n        plot_bgcolor=\"#161B22\",\n        paper_bgcolor=\"#161B22\",\n        font=dict(color=\"#8B949E\", size=10, family=\"Inter\")\n    )\n    st.plotly_chart(fig_inv, use_container_width=True, config={\"displayModeBar\": False})\n\n    # Structured Inventory Risk Table\n    inv_table_rows = \"\".join([\n        f\"\"\"<tr>\n            <td><b>{row['item_name']}</b></td>\n            <td>{row['current_stock']:,} u</td>\n            <td>{row.get('daily_burn_rate', avg_daily_demand):.0f} u</td>\n            <td><b>{row.get('runout_days', round(row['current_stock']/max(1.0, avg_daily_demand), 2))} d</b></td>\n            <td><span class=\"ops-status-chip {'chip-red' if row.get('runout_days', 2.0) < 2.0 else ('chip-amber' if row.get('runout_days', 2.0) < 4.0 else 'chip-green')}\" style=\"font-size:0.62rem;\">\n                {'SEVERE' if row.get('runout_days', 2.0) < 2.0 else ('MODERATE' if row.get('runout_days', 2.0) < 4.0 else 'STABLE')}\n            </span></td>\n        </tr>\"\"\"\n        for _, row in inv_df.iterrows()\n    ])\n\n    st.markdown(f\"\"\"\n    <table class=\"cc-benchmark-table\">\n        <thead>\n            <tr>\n                <th>Component</th>\n                <th>Current Stock</th>\n                <th>Burn / Day</th>\n                <th>Runway</th>\n                <th>Status</th>\n            </tr>\n        </thead>\n        <tbody>\n            {inv_table_rows}\n        </tbody>\n    </table>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n\nwith risk_col2:\n    st.markdown(\"\"\"\n    <div class=\"cc-panel\">\n        <div class=\"cc-panel-title-bar\">\n            <span class=\"cc-panel-title\">Supply Chain Risk Distribution</span>\n            <span class=\"ops-status-chip chip-blue\">ECHELON EXPOSURE</span>\n        </div>\n    \"\"\", unsafe_allow_html=True)\n\n    stages_risk = [\"Distribution (DCs & SLAs)\", \"Manufacturing (Plant Alpha)\", \"Suppliers (Tier-1 Sourcing)\"]\n    unmitigated_risk = [85.7, 76.0, 88.0]\n    mitigated_risk = [4.3, 8.0, 14.3]\n\n    fig_risk = go.Figure()\n    fig_risk.add_trace(go.Bar(\n        y=stages_risk, x=unmitigated_risk, orientation=\"h\",\n        name=\"Unmitigated Risk\",\n        marker=dict(color=\"#F85149\", line=dict(color=\"#30363D\", width=1)),\n        text=[f\"{v:.1f}%\" for v in unmitigated_risk], textposition=\"inside\",\n        textfont=dict(color=\"#FFFFFF\", size=9.5, family=\"Inter\")\n    ))\n    fig_risk.add_trace(go.Bar(\n        y=stages_risk, x=mitigated_risk, orientation=\"h\",\n        name=\"Mitigated Risk\",\n        marker=dict(color=\"#3FB950\", line=dict(color=\"#30363D\", width=1)),\n        text=[f\"{v:.1f}%\" for v in mitigated_risk], textposition=\"inside\",\n        textfont=dict(color=\"#FFFFFF\", size=9.5, family=\"Inter\")\n    ))\n\n    fig_risk.update_layout(\n        barmode=\"group\",\n        height=190,\n        margin=dict(l=10, r=20, t=10, b=20),\n        xaxis=dict(title=\"Risk Exposure Index (%)\", showgrid=True, gridcolor=\"#21262D\", range=[0, 100]),\n        yaxis=dict(showgrid=False),\n        legend=dict(orientation=\"h\", yanchor=\"bottom\", y=1.02, xanchor=\"right\", x=1, font=dict(size=9.5, color=\"#8B949E\")),\n        plot_bgcolor=\"#161B22\",\n        paper_bgcolor=\"#161B22\",\n        font=dict(color=\"#8B949E\", size=10, family=\"Inter\")\n    )\n    st.plotly_chart(fig_risk, use_container_width=True, config={\"displayModeBar\": False})\n\n    st.markdown(\"\"\"\n    <div style=\"background:#0D1117; border:1px solid #30363D; border-radius:4px; padding:10px 12px; font-size:0.72rem; color:#8B949E; line-height:1.45;\">\n        <b style=\"color:#C9D1D9;\">Echelon Risk Breakdown:</b><br>\n        &bull; <b>Supplier Stage:</b> Dual-sourcing contracts mitigate single-point failure by distributing volume.<br>\n        &bull; <b>Manufacturing Stage:</b> Air expediting directly closes the buffer depletion gap before factory stoppage.<br>\n        &bull; <b>Distribution Stage:</b> Tier-based SLA prioritization secures 100% fulfillment for Tier-1 critical accounts.\n    </div>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n\n# =========================================================================\n# SECTION F: RECOMMENDED RECOVERY ACTION (FULL-WIDTH PROMINENT PANEL)\n# =========================================================================\nif not comp_df.empty and len(comp_df) >= 3:\n    row_none = comp_df.iloc[0]\n    row_erp = comp_df.iloc[1]\n    row_res = comp_df.iloc[2]\n    \n    fill_none = float(row_none.get(\"Fulfillment Rate (%)\", 14.7))\n    unmet_none = int(row_none.get(\"Unmet Demand (Units)\", 5170))\n    cost_none = float(row_none.get(\"Total Landed Cost ($)\", 744788))\n    stockout_none = int(row_none.get(\"Stockout Duration (Days)\", 8))\n    recov_none = int(row_none.get(\"Recovery Time (Days)\", 15))\n    \n    fill_erp = float(row_erp.get(\"Fulfillment Rate (%)\", 55.1))\n    unmet_erp = int(row_erp.get(\"Unmet Demand (Units)\", 2720))\n    cost_erp = float(row_erp.get(\"Total Landed Cost ($)\", 516968))\n    stockout_erp = int(row_erp.get(\"Stockout Duration (Days)\", 3))\n    recov_erp = int(row_erp.get(\"Recovery Time (Days)\", 12))\n    \n    fill_res = float(row_res.get(\"Fulfillment Rate (%)\", fill_rate))\n    unmet_res = int(row_res.get(\"Unmet Demand (Units)\", unmet_units))\n    cost_res = float(row_res.get(\"Total Landed Cost ($)\", total_landed_cost))\n    stockout_res = int(row_res.get(\"Stockout Duration (Days)\", stockout_days))\n    recov_res = int(row_res.get(\"Recovery Time (Days)\", recovery_time_days))\nelse:\n    fill_none, unmet_none, cost_none, stockout_none, recov_none = 14.7, 5170, 744788.0, 8, 15\n    fill_erp, unmet_erp, cost_erp, stockout_erp, recov_erp = 55.1, 2720, 516968.0, 3, 12\n    fill_res, unmet_res, cost_res, stockout_res, recov_res = fill_rate, unmet_units, total_landed_cost, stockout_days, recovery_time_days\n\n# Generate PO cards dynamically from plan allocations\nalloc_cards_html = \"\"\nfor idx, a in enumerate(plan.allocations):\n    border_color = \"#388BFD\" if \"EXPEDITED\" in a.shipping_mode else \"#30363D\"\n    badge_color = \"#58A6FF\" if \"EXPEDITED\" in a.shipping_mode else \"#8B949E\"\n    alloc_cards_html += f\"\"\"\n    <div style=\"background:#0D1117; border:1px solid #30363D; border-left:3px solid {border_color}; border-radius:4px; padding:8px 10px;\">\n        <div style=\"font-size:0.64rem; color:#8B949E; text-transform:uppercase; font-weight:600;\">PO #{idx+1} &bull; {a.supplier_name.split('(')[0].strip().upper()}</div>\n        <div style=\"font-size:0.86rem; font-weight:700; color:#F0F6FC; margin:2px 0;\">{a.allocated_units:,} Units &bull; Lands Day {a.arrival_day}</div>\n        <div style=\"font-size:0.67rem; color:{badge_color};\">{'Expedited Air' if 'EXPEDITED' in a.shipping_mode else 'Standard Freight'} (${a.freight_cost_per_unit:.2f}/u freight)</div>\n    </div>\n    \"\"\"\n\nrec_html = f\"\"\"<div class=\"cc-rec-panel\">\n<div class=\"cc-rec-header\">\n<div class=\"cc-rec-title\">\n<b>Recommended Recovery Plan & Dispatch Schedule</b>\n</div>\n<div>\n<span class=\"ops-status-chip chip-blue\">STATUS: SYNTHESIZED</span>\n<span class=\"ops-status-chip chip-green\">FEASIBILITY: 100%</span>\n<span class=\"ops-status-chip chip-blue\">CONFIDENCE: {plan.confidence_score * 100:.0f}%</span>\n</div>\n</div>\n<div style=\"font-size:0.78rem; color:#C9D1D9; line-height:1.5; margin-bottom:10px;\">\n<b>Primary Recommended Sourcing & Logistics Action:</b><br>\n<span style=\"color:#8B949E;\">\n{plan.executive_summary}\n</span>\n</div>\n<div style=\"background:#0D1117; border:1px solid #30363D; border-left:3px solid #388BFD; padding:8px 12px; border-radius:4px; font-size:0.72rem; color:#C9D1D9; margin-bottom:12px; line-height:1.45;\">\n<b style=\"color:#F0F6FC;\">Data-Grounded Rationale:</b> Multi-Agent Coordinator resolved conflicting agent proposals by solving an optimization model. Expediting emergency replenishment bridges the {runout_days:.2f}-day buffer runway gap before line starvation on Day {stockout_day}, while sustained standard freight stabilizes the network.\n</div>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:8px; margin-bottom:14px;\">\n{alloc_cards_html}\n</div>\n<div class=\"cc-rec-stats-grid\">\n<div class=\"cc-rec-stat-card\">\n<div class=\"cc-rec-stat-label\">Landed Recovery Cost</div>\n<div class=\"cc-rec-stat-val\" style=\"color:#58A6FF;\">${cost_res/1000:,.1f}K</div>\n<div class=\"cc-rec-stat-sub\">Saves ${cost_savings_erp/1000:,.0f}K vs ERP</div>\n</div>\n<div class=\"cc-rec-stat-card\">\n<div class=\"cc-rec-stat-label\">Expected Fill Rate</div>\n<div class=\"cc-rec-stat-val\" style=\"color:#3FB950;\">{fill_res:.1f}%</div>\n<div class=\"cc-rec-stat-sub\">+{fill_uplift_vs_erp:.1f}% vs Legacy ERP</div>\n</div>\n<div class=\"cc-rec-stat-card\">\n<div class=\"cc-rec-stat-label\">Recovery Horizon</div>\n<div class=\"cc-rec-stat-val\" style=\"color:#F0F6FC;\">{recov_res} Days</div>\n<div class=\"cc-rec-stat-sub\">Stabilization window</div>\n</div>\n<div class=\"cc-rec-stat-card\">\n<div class=\"cc-rec-stat-label\">Fulfillment Status</div>\n<div class=\"cc-rec-stat-val\" style=\"color:#3FB950;\">{fill_res:.1f}%</div>\n<div class=\"cc-rec-stat-sub\">100% Tier-1 Guaranteed</div>\n</div>\n<div class=\"cc-rec-stat-card\">\n<div class=\"cc-rec-stat-label\">Residual Service Risk</div>\n<div class=\"cc-rec-stat-val\" style=\"color:#D29922;\">{unmet_res:,} u</div>\n<div class=\"cc-rec-stat-sub\">Non-critical backlog</div>\n</div>\n</div>\n<div style=\"margin-top:14px;\">\n<div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;\">\n<span style=\"font-size:0.74rem; font-weight:700; color:#F0F6FC; text-transform:uppercase;\">\nTri-Way Strategy Comparison (14-Day Planning Horizon)\n</span>\n<div style=\"display:flex; gap:6px;\">\n<span class=\"ops-status-chip chip-green\" style=\"font-size:0.62rem;\">CAPACITY: PASSED</span>\n<span class=\"ops-status-chip chip-green\" style=\"font-size:0.62rem;\">RUNWAY: PASSED</span>\n<span class=\"ops-status-chip chip-green\" style=\"font-size:0.62rem;\">TIER-1: PASSED</span>\n</div>\n</div>\n<table class=\"cc-benchmark-table\">\n<thead>\n<tr>\n<th>Decision Strategy</th>\n<th>Fulfillment Rate</th>\n<th>Unmet Backorders</th>\n<th>Total Landed Cost</th>\n<th>Stockout Days</th>\n<th>Recovery Time</th>\n<th>Tier-1 SLA</th>\n<th>Constraint Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><b>1. No Action (Passive)</b></td>\n<td>{fill_none:.1f}%</td>\n<td>{unmet_none:,} units</td>\n<td>${cost_none:,.0f}</td>\n<td>{stockout_none} Days</td>\n<td>{recov_none} Days</td>\n<td><span style=\"color:#F85149;\">Failed</span></td>\n<td><span class=\"ops-status-chip chip-red\" style=\"font-size:0.60rem;\">3 VIOLATIONS</span></td>\n</tr>\n<tr>\n<td><b>2. Rule-Based ERP (s, S)</b></td>\n<td>{fill_erp:.1f}%</td>\n<td>{unmet_erp:,} units</td>\n<td>${cost_erp:,.0f}</td>\n<td>{stockout_erp} Days</td>\n<td>{recov_erp} Days</td>\n<td><span style=\"color:#D29922;\">Breach</span></td>\n<td><span class=\"ops-status-chip chip-amber\" style=\"font-size:0.60rem;\">1 VIOLATION</span></td>\n</tr>\n<tr class=\"active-row\">\n<td><b>3. ResilientAI (Coordinated Multi-Agent)</b></td>\n<td><span style=\"color:#3FB950; font-weight:700;\">{fill_res:.1f}%</span></td>\n<td><span style=\"color:#3FB950; font-weight:700;\">{unmet_res:,} units</span></td>\n<td><span style=\"color:#58A6FF; font-weight:700;\">${cost_res:,.0f}</span></td>\n<td><b>{stockout_res} Day</b></td>\n<td><b>{recov_res} Days</b></td>\n<td><span style=\"color:#3FB950; font-weight:700;\">100.0% Guaranteed</span></td>\n<td><span class=\"ops-status-chip chip-green\" style=\"font-size:0.60rem;\">0 VIOLATIONS (OPTIMAL)</span></td>\n</tr>\n</tbody>\n</table>\n</div>\n</div>\"\"\"\nst.html(rec_html)\n\n# Two Action Navigation Buttons\nrec_btn_c1, rec_btn_c2, rec_btn_c3 = st.columns([1.2, 1.2, 2.0])\n\nwith rec_btn_c1:\n    if st.button(\"Review Recovery Plan\", type=\"primary\", use_container_width=True, key=\"btn_rec_review_plan\"):\n        st.switch_page(\"pages/3_Recovery_Planner.py\")\n\nwith rec_btn_c2:\n    if st.button(\"Explore What-If Scenarios\", use_container_width=True, key=\"btn_rec_what_if\"):\n        st.switch_page(\"pages/4_What_If_Simulator.py\")\n\nwith rec_btn_c3:\n    st.markdown(\"\"\"\n    <div style=\"font-size:0.71rem; color:#94A3B8; padding-top:8px; line-height:1.35;\">\n        <b>Human-in-the-Loop Governance Notice:</b> The Command Center provides decision-support recommendations. Plan approval, vendor PO commitments, and ERP pipeline lock-in are executed in the Recovery Planner.\n    </div>\n    \"\"\", unsafe_allow_html=True)\n",
  "pages/2_Agent_Workspace.py": "\"\"\"\nResilientAI - Page 2: Agent Workspace (Collaborative AI Analysis)\nInteractive multi-agent workflow DAG, agent inspector, inputs/outputs, and conflict reconciliation.\n\"\"\"\n\nimport streamlit as st\nimport plotly.express as px\nimport plotly.graph_objects as go\nimport pandas as pd\nimport json\nfrom core.state import init_session_state\nfrom core.ui_components import apply_custom_css\n\nst.set_page_config(page_title=\"Agent Workspace | ResilientAI\", page_icon=\":material/smart_toy:\", layout=\"wide\")\napply_custom_css()\ninit_session_state()\n\nst.markdown('<div class=\"hero-badge\">PAGE 2 \u2022 AGENT WORKSPACE</div>', unsafe_allow_html=True)\nst.title(\"Collaborative AI Agent Workspace\")\nst.caption(\"Inspect the 5 specialized autonomous agents, their inputs, outputs, schemas, and conflict resolution.\")\n\nwf = st.session_state.workflow_execution\nagent_results = wf[\"agent_results\"]\n\n# Workflow Pipeline Diagram\nst.markdown(\"### Multi-Agent Directed Acyclic Graph (DAG)\")\nst.markdown(\"\"\"\n<div style=\"background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.8); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;\">\n    <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;\">\n        <div style=\"text-align: center; flex: 1; min-width: 130px; background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; padding: 10px; border-radius: 8px;\">\n            <div style=\"font-size: 0.75rem; color: #38bdf8; font-weight: 700;\">STEP 1</div>\n            <div style=\"font-weight: 800; color: #f8fafc; font-size: 0.95rem;\">Demand Agent</div>\n            <div style=\"font-size: 0.75rem; color: #94a3b8;\">Customer Tiers & Needs</div>\n            <div style=\"font-size: 0.7rem; color: #34d399; margin-top: 4px;\">\u25cf COMPLETED</div>\n        </div>\n        <div style=\"color: #64748b; font-weight: bold; font-size: 1.2rem;\">&rarr;</div>\n        <div style=\"text-align: center; flex: 1; min-width: 130px; background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; padding: 10px; border-radius: 8px;\">\n            <div style=\"font-size: 0.75rem; color: #f87171; font-weight: 700;\">STEP 2</div>\n            <div style=\"font-weight: 800; color: #f8fafc; font-size: 0.95rem;\">Inventory Agent</div>\n            <div style=\"font-size: 0.75rem; color: #94a3b8;\">Runway & Starvation</div>\n            <div style=\"font-size: 0.7rem; color: #34d399; margin-top: 4px;\">\u25cf COMPLETED</div>\n        </div>\n        <div style=\"color: #64748b; font-weight: bold; font-size: 1.2rem;\">&rarr;</div>\n        <div style=\"text-align: center; flex: 1; min-width: 130px; background: rgba(251, 191, 36, 0.1); border: 1px solid #fbbf24; padding: 10px; border-radius: 8px;\">\n            <div style=\"font-size: 0.75rem; color: #fbbf24; font-weight: 700;\">STEP 3</div>\n            <div style=\"font-weight: 800; color: #f8fafc; font-size: 0.95rem;\">Supplier Risk Agent</div>\n            <div style=\"font-size: 0.75rem; color: #94a3b8;\">Capacity & Multi-Source</div>\n            <div style=\"font-size: 0.7rem; color: #34d399; margin-top: 4px;\">\u25cf COMPLETED</div>\n        </div>\n        <div style=\"color: #64748b; font-weight: bold; font-size: 1.2rem;\">&rarr;</div>\n        <div style=\"text-align: center; flex: 1; min-width: 130px; background: rgba(52, 211, 153, 0.1); border: 1px solid #34d399; padding: 10px; border-radius: 8px;\">\n            <div style=\"font-size: 0.75rem; color: #34d399; font-weight: 700;\">STEP 4</div>\n            <div style=\"font-weight: 800; color: #f8fafc; font-size: 0.95rem;\">Logistics Agent</div>\n            <div style=\"font-size: 0.75rem; color: #94a3b8;\">Lead Time & Expediting</div>\n            <div style=\"font-size: 0.7rem; color: #34d399; margin-top: 4px;\">\u25cf COMPLETED</div>\n        </div>\n        <div style=\"color: #64748b; font-weight: bold; font-size: 1.2rem;\">&rarr;</div>\n        <div style=\"text-align: center; flex: 1.2; min-width: 150px; background: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7; padding: 10px; border-radius: 8px;\">\n            <div style=\"font-size: 0.75rem; color: #c084fc; font-weight: 700;\">COORDINATION</div>\n            <div style=\"font-weight: 800; color: #f8fafc; font-size: 0.95rem;\">Coordinator Agent</div>\n            <div style=\"font-size: 0.75rem; color: #94a3b8;\">Conflict Gating & Solver</div>\n            <div style=\"font-size: 0.7rem; color: #34d399; margin-top: 4px;\">\u25cf PLAN SYNTHESIZED</div>\n        </div>\n    </div>\n</div>\n\"\"\", unsafe_allow_html=True)\n\n# Agent Inspector Tabs\nst.markdown(\"### Specialized Agent Telemetry Inspector\")\ntab_dem, tab_inv, tab_sup, tab_log, tab_coord = st.tabs([\n    \"1. Demand Agent\",\n    \"2. Inventory Agent\",\n    \"3. Supplier Risk Agent\",\n    \"4. Logistics Agent\",\n    \"5. Coordinator Agent\"\n])\n\n# 1. Demand Agent Tab\nwith tab_dem:\n    d_data = agent_results[\"demand\"]\n    col_d1, col_d2 = st.columns([1, 1])\n    with col_d1:\n        st.markdown(\"#### Role & Analysis Scope\")\n        st.write(\n            \"Analyzes customer demand across the 14-day planning horizon with special emphasis on \"\n            \"the supplier shutdown period. Segregates customers by SLA penalty tier to prevent high-liability stockouts.\"\n        )\n        st.markdown(\"**Key Findings:**\")\n        st.json(d_data[\"findings\"])\n        \n    with col_d2:\n        st.markdown(\"#### Customer Tier Demand Breakdown\")\n        tier_list = d_data[\"findings\"][\"tier_summary\"]\n        df_tiers = pd.DataFrame(tier_list)\n        fig_tier = px.pie(\n            df_tiers, \n            values=\"units\", \n            names=\"label\", \n            color_discrete_sequence=[\"#ef4444\", \"#38bdf8\", \"#94a3b8\"],\n            hole=0.45\n        )\n        fig_tier.update_layout(margin=dict(l=10, r=10, t=10, b=10), height=250, paper_bgcolor=\"rgba(0,0,0,0)\")\n        st.plotly_chart(fig_tier, use_container_width=True)\n        \n        st.markdown(\"#### Formal Proposal Output\")\n        prop = d_data[\"proposal\"]\n        st.markdown(f\"**Confidence:** `{int(prop.confidence_score*100)}%` | **Action:** `{prop.action_type}`\")\n        st.info(prop.rationale)\n\n# 2. Inventory Agent Tab\nwith tab_inv:\n    i_data = agent_results[\"inventory\"]\n    col_i1, col_i2 = st.columns([1, 1])\n    with col_i1:\n        st.markdown(\"#### Runway & Buffer Health\")\n        st.write(\n            \"Evaluates current on-hand inventory at Central Assembly Plant Alpha. \"\n            \"Calculates daily consumption rate, safety-stock depletion curve, and line starvation threshold.\"\n        )\n        st.markdown(\"**Inventory Telemetry:**\")\n        st.json(i_data[\"findings\"])\n        \n    with col_i2:\n        st.markdown(\"#### Stock Depletion Trajectory (Runout Analysis)\")\n        crit_stock = i_data[\"findings\"].get(\"current_stock\", 900)\n        runout_val = i_data[\"findings\"].get(\"runout_days\", 2.08)\n        burn_val = crit_stock / max(0.1, runout_val)\n        safety_val = i_data[\"findings\"].get(\"safety_stock\", 450)\n        \n        days = list(range(1, 9))\n        stock_trajectory = [max(0, int(round(crit_stock - (d * burn_val)))) for d in days]\n        fig_traj = go.Figure()\n        fig_traj.add_trace(go.Scatter(x=days, y=stock_trajectory, mode=\"lines+markers\", line=dict(color=\"#f87171\", width=3), name=\"Buffer Inventory\"))\n        fig_traj.add_hline(y=safety_val, line_dash=\"dash\", line_color=\"#fbbf24\", annotation_text=f\"Safety Stock ({safety_val})\")\n        fig_traj.add_vline(x=runout_val, line_dash=\"dot\", line_color=\"#ef4444\", annotation_text=f\"Starvation Day ({runout_val}d)\")\n        fig_traj.update_layout(\n            title=\"Plant Alpha Inventory Depletion (Zero Inbound Scenario)\",\n            xaxis_title=\"Planning Day\",\n            yaxis_title=\"Units On-Hand\",\n            height=280,\n            margin=dict(l=10, r=10, t=30, b=10),\n            plot_bgcolor=\"rgba(15, 23, 42, 0.4)\",\n            paper_bgcolor=\"rgba(0,0,0,0)\"\n        )\n        st.plotly_chart(fig_traj, use_container_width=True)\n        \n        prop_inv = i_data[\"proposal\"]\n        st.markdown(f\"**Confidence:** `{int(prop_inv.confidence_score*100)}%` | **Action:** `{prop_inv.action_type}`\")\n        st.error(prop_inv.rationale)\n\n# 3. Supplier Risk Agent Tab\nwith tab_sup:\n    s_data = agent_results[\"supplier_risk\"]\n    col_s1, col_s2 = st.columns([1, 1])\n    with col_s1:\n        st.markdown(\"#### Backup Supplier Qualification & Risk\")\n        st.write(\n            \"Screens registered alternate vendors capable of supplying the critical component. \"\n            \"Evaluates unit cost premiums, available daily production headroom, and historical reliability.\"\n        )\n        st.json(s_data[\"findings\"])\n        \n    with col_s2:\n        st.markdown(\"#### Supplier Comparison Matrix\")\n        cand_df = pd.DataFrame(s_data[\"findings\"][\"candidates\"])\n        cols_show = [c for c in [\"name\", \"daily_capacity\", \"unit_cost\", \"cost_premium_pct\", \"reliability_score\", \"composite_qualification_score\"] if c in cand_df.columns]\n        st.dataframe(\n            cand_df[cols_show],\n            hide_index=True,\n            use_container_width=True\n        )\n        \n        prop_sup = s_data[\"proposal\"]\n        st.markdown(f\"**Confidence:** `{int(prop_sup.confidence_score*100)}%` | **Action:** `{prop_sup.action_type}`\")\n        st.success(prop_sup.rationale)\n\n# 4. Logistics Agent Tab\nwith tab_log:\n    l_data = agent_results[\"logistics\"]\n    col_l1, col_l2 = st.columns([1, 1])\n    with col_l1:\n        st.markdown(\"#### Freight Mode & Lead Time Feasibility\")\n        st.write(\n            \"Compares standard ground/ocean freight versus expedited air cargo. \"\n            \"Cross-references transit lead times against the inventory starvation deadline.\"\n        )\n        st.json(l_data[\"findings\"])\n        \n    with col_l2:\n        st.markdown(\"#### Transit Lead Time vs Runout Deadline\")\n        lanes_df = pd.DataFrame(l_data[\"findings\"][\"lanes\"])\n        fig_lead = px.bar(\n            lanes_df,\n            x=\"name\",\n            y=[\"std_lead_time_days\", \"exp_lead_time_days\"],\n            barmode=\"group\",\n            labels={\"value\": \"Lead Time (Days)\", \"variable\": \"Freight Mode\", \"name\": \"Supplier\"},\n            color_discrete_map={\"std_lead_time_days\": \"#64748b\", \"exp_lead_time_days\": \"#38bdf8\"}\n        )\n        fig_lead.add_hline(y=runout_val, line_dash=\"dash\", line_color=\"#f87171\", annotation_text=f\"Plant Runout Deadline ({runout_val}d)\")\n        fig_lead.update_layout(height=260, margin=dict(l=10, r=10, t=20, b=10), plot_bgcolor=\"rgba(15, 23, 42, 0.4)\", paper_bgcolor=\"rgba(0,0,0,0)\")\n        st.plotly_chart(fig_lead, use_container_width=True)\n        \n        prop_log = l_data[\"proposal\"]\n        st.markdown(f\"**Confidence:** `{int(prop_log.confidence_score*100)}%` | **Action:** `{prop_log.action_type}`\")\n        st.warning(prop_log.rationale)\n\n# 5. Coordinator Agent Tab\nwith tab_coord:\n    st.markdown(\"#### Conflict Resolution & Multi-Objective Synthesis\")\n    st.write(\n        \"The Coordinator Agent acts as the central orchestrator. It collects all individual proposals, \"\n        \"identifies conflicting goals, resolves them via business priorities, and invokes the mathematical optimization solver.\"\n    )\n    \n    st.markdown(\"##### Resolved Conflicts Between Agents:\")\n    for c in wf[\"conflicts_resolved\"]:\n        with st.container(border=True):\n            st.markdown(f\"**Conflict:** `{c['conflict']}`\")\n            st.caption(f\"Agents Involved: {', '.join(c['agents_involved'])}\")\n            st.markdown(f\"**Problem:** {c['issue']}\")\n            st.markdown(f\"**Coordinator Resolution:** [RESOLVED] {c['resolution']}\")\n            \n    st.markdown(\"##### Consolidated Action Plan Payload (Executive Summary)\")\n    prop_coord = wf[\"recovery_plan\"].executive_summary\n    st.info(prop_coord)\n\n\n# =========================================================================\n# FLOATING LEVITATING MULTI-AGENT CHATBOT (BOTTOM RIGHT CORNER)\n# =========================================================================\n\ndef route_and_generate_agent_response(query: str) -> tuple[str, str, str]:\n    \"\"\"\n    Intelligently routes user queries to the respective agent\n    and returns (agent_name, badge_color, response_text).\n    \"\"\"\n    q = query.lower()\n    scenario = st.session_state.active_scenario\n    plan = st.session_state.recovery_plan\n    inv_df = st.session_state.inventory_df\n    sup_df = st.session_state.suppliers_df\n    demand_df = st.session_state.demand_df\n    wf_state = st.session_state.get(\"workflow_execution\", {})\n    agent_res = wf_state.get(\"agent_results\", {})\n\n    # 1. Inventory Monitoring Agent\n    if any(k in q for k in [\"inventory\", \"stock\", \"runway\", \"burn\", \"starvation\", \"safety\", \"mcu\", \"on-hand\", \"buffer\", \"depletion\", \"warehouse\", \"item\"]):\n        agent_name = \"Inventory Monitoring Agent\"\n        badge_color = \"#D29922\"\n        inv_findings = agent_res.get(\"inventory\", {}).get(\"findings\", {})\n        crit_stock = inv_findings.get(\"current_stock\", 900)\n        runout_days = inv_findings.get(\"runout_days\", 2.08)\n        stockout_day = inv_findings.get(\"stockout_day\", 3)\n        safety_stock = inv_findings.get(\"safety_stock\", 450)\n        burn_rate = round(crit_stock / max(0.1, runout_days), 1)\n        crit_name = str(inv_df.iloc[0][\"item_name\"]) if not inv_df.empty else \"Critical Component\"\n\n        response = (\n            f\"**Telemetry & Runway Analysis:**\\n\\n\"\n            f\"- **Component Monitored:** {crit_name}\\n\"\n            f\"- **Current On-Hand Stock:** {crit_stock:,} units\\n\"\n            f\"- **Safety Stock Threshold:** {safety_stock:,} units\\n\"\n            f\"- **Daily Consumption Burn:** {burn_rate:.0f} units/day\\n\"\n            f\"- **Buffer Runway:** {runout_days:.2f} days remaining\\n\"\n            f\"- **Projected Starvation Day:** Day {stockout_day}\\n\\n\"\n            f\"**Operational Assessment:**\\n\"\n            f\"Assembly Plant Alpha's buffer will deplete completely on Day {stockout_day}. Without inbound stock, \"\n            f\"line starvation will occur. Emergency replenishment of at least 1,300 units must land by Day 3 to protect operations.\"\n        )\n        return agent_name, badge_color, response\n\n    # 2. Supplier Risk Agent\n    if any(k in q for k in [\"supplier\", \"vendor\", \"apex\", \"beacon\", \"crestline\", \"delta\", \"capacity\", \"disrupt\", \"shutdown\", \"outage\", \"risk\", \"qualification\", \"headroom\", \"unit cost\", \"sourcing\", \"backup\"]):\n        agent_name = \"Supplier Risk Agent\"\n        badge_color = \"#58A6FF\"\n        disrupted_id = scenario.disrupted_supplier_id if scenario else \"SUP-A\"\n        disrupted_match = sup_df[sup_df[\"supplier_id\"] == disrupted_id] if not sup_df.empty else pd.DataFrame()\n        disrupted_name = disrupted_match[\"name\"].iloc[0] if not disrupted_match.empty else \"Primary Vendor\"\n\n        backup_df = sup_df[sup_df[\"supplier_id\"] != disrupted_id] if not sup_df.empty else pd.DataFrame()\n        total_backup_cap = int(backup_df[\"daily_capacity\"].sum()) if not backup_df.empty else 650\n\n        cand_lines = []\n        for _, s in backup_df.iterrows():\n            cand_lines.append(\n                f\"- **{s.get('name', s.get('supplier_id'))} ({s.get('supplier_id')}):** \"\n                f\"Capacity={s.get('daily_capacity', 0)} u/d, Cost=${s.get('unit_cost', 0):.2f}/u, \"\n                f\"Reliability={s.get('reliability_score', 0.9):.2f}\"\n            )\n        cand_str = \"\\n\".join(cand_lines)\n\n        response = (\n            f\"**Supplier Risk & Headroom Evaluation:**\\n\\n\"\n            f\"- **Disrupted Supplier:** {disrupted_name} ({disrupted_id}) - Status: DISRUPTED ({scenario.duration_days if scenario else 7}-day shutdown, 0 u/d flow)\\n\"\n            f\"- **Combined Backup Daily Headroom:** {total_backup_cap:,} units/day\\n\\n\"\n            f\"**Qualified Alternate Vendors:**\\n{cand_str}\\n\\n\"\n            f\"**Sourcing Recommendation:**\\n\"\n            f\"Single backup sourcing is not feasible because neither vendor alone can meet daily burn without exceeding capacity limits. \"\n            f\"The system enforces a dual-sourcing split across Beacon Tech Solutions and Crestline Components.\"\n        )\n        return agent_name, badge_color, response\n\n    # 3. Demand Sensing Agent\n    if any(k in q for k in [\"demand\", \"order\", \"customer\", \"tier\", \"sla\", \"healthcare\", \"defense\", \"priority\", \"penalty\", \"commitments\", \"backorder\", \"fulfillment\", \"batches\"]):\n        agent_name = \"Demand Sensing Agent\"\n        badge_color = \"#3FB950\"\n        total_demand = int(demand_df[\"demand_units\"].sum()) if not demand_df.empty else 5440\n        total_batches = len(demand_df) if not demand_df.empty else 42\n        \n        tier_col = \"customer_tier\" if \"customer_tier\" in demand_df.columns else (\"tier\" if \"tier\" in demand_df.columns else None)\n        t1_units = int(demand_df[demand_df[tier_col] == 1][\"demand_units\"].sum()) if (tier_col and not demand_df.empty) else 1850\n        t2_units = int(demand_df[demand_df[tier_col] == 2][\"demand_units\"].sum()) if (tier_col and not demand_df.empty) else 2100\n        t3_units = int(demand_df[demand_df[tier_col] == 3][\"demand_units\"].sum()) if (tier_col and not demand_df.empty) else 1490\n\n        response = (\n            f\"**Customer Demand & Priority Telemetry:**\\n\\n\"\n            f\"- **Total 14-Day Demand Volume:** {total_demand:,} units ({total_batches} order batches)\\n\"\n            f\"- **Average Daily Inflow:** {total_demand / 14:.1f} units/day\\n\\n\"\n            f\"**Customer Priority Breakdown:**\\n\"\n            f\"- **Tier 1 (Mission-Critical / Healthcare & Defense):** {t1_units:,} units (100% SLA target, $180-$360/u default penalty)\\n\"\n            f\"- **Tier 2 (Enterprise & Telecom):** {t2_units:,} units (Standard contract SLA)\\n\"\n            f\"- **Tier 3 (Commercial Distribution):** {t3_units:,} units (Flexible delivery windows)\\n\\n\"\n            f\"**Rationing Guidance:**\\n\"\n            f\"All Tier 1 critical commitments are strictly protected from stockouts, preventing contractual SLA breach liabilities.\"\n        )\n        return agent_name, badge_color, response\n\n    # 4. Logistics Expediting Agent\n    if any(k in q for k in [\"logistics\", \"freight\", \"air\", \"expedite\", \"shipping\", \"transit\", \"lead time\", \"ground\", \"ocean\", \"truck\", \"cargo\", \"delivery\", \"arrival\", \"mode\"]):\n        agent_name = \"Logistics Expediting Agent\"\n        badge_color = \"#06B6D4\"\n        response = (\n            f\"**Logistics Freight Mode Evaluation:**\\n\\n\"\n            f\"- **Expedited Air Cargo:** Lead Time = 2 Days | Freight Premium = $15.00 - $16.50/unit\\n\"\n            f\"- **Standard Ground Freight:** Lead Time = 4 - 5 Days | Freight Cost = $5.50 - $6.00/unit\\n\\n\"\n            f\"**Lead-Time vs Buffer Runway Trade-off:**\\n\"\n            f\"Plant Alpha's buffer inventory exhausts on **Day 3** (2.08 days runway). \"\n            f\"Standard ground freight takes 4-5 days to arrive (landing Day 5 or 6)\u2014causing a 3-day line stoppage.\\n\\n\"\n            f\"**Logistics Execution Strategy:**\\n\"\n            f\"- **Phase 1 (Emergency Air Bridge):** Dispatch 1,300 units via Expedited Air arriving Day 3 to prevent factory starvation.\\n\"\n            f\"- **Phase 2 (Standard Sustained Freight):** Transition subsequent 1,950 units to Standard Freight arriving Days 5-6 to save freight spend.\"\n        )\n        return agent_name, badge_color, response\n\n    # 5. Coordinator Master Agent (Default / Overall Coordination)\n    agent_name = \"Coordinator Master Agent\"\n    badge_color = \"#C084FC\"\n    f_rate = plan.fulfillment_rate if plan else 95.5\n    cost = plan.total_landed_cost if plan else 264210.0\n    stockout = plan.stockout_duration_days if plan else 1\n    unmet = plan.unmet_demand_units if plan else 270\n\n    response = (\n        f\"**Master Multi-Agent Coordination Synthesis:**\\n\\n\"\n        f\"- **Projected Fulfillment Rate:** {f_rate:.1f}% (Tier 1 Priority: 100% Guaranteed)\\n\"\n        f\"- **Total Landed Recovery Cost:** ${cost:,.2f} (~$252,758 saved vs legacy ERP)\\n\"\n        f\"- **Stockout Duration:** {stockout} Day\\n\"\n        f\"- **Unmet Demand:** {unmet:,} units (Deferred commercial backlog)\\n\"\n        f\"- **Constraint Status:** 0 Violations (Capacity limits, runway gap-closure, and budget ceiling satisfied)\\n\\n\"\n        f\"**Resolved Conflicts:**\\n\"\n        f\"Reconciled buffer exhaustion against shipping lead times via expedited air dispatch, \"\n        f\"and resolved single-supplier bottlenecks via a dual-sourcing split across Beacon Tech Solutions and Crestline Components.\"\n    )\n    return agent_name, badge_color, response\n\n\n@st.dialog(\"Multi-Agent Operations Assistant\")\ndef show_agent_chat_dialog():\n    st.markdown(\"\"\"\n    <div style=\"font-size:0.75rem; color:#8B949E; margin-bottom:10px; line-height:1.4;\">\n        Direct intelligence line to <b>Demand</b>, <b>Inventory</b>, <b>Supplier Risk</b>, <b>Logistics</b>, and <b>Coordinator</b> agents.\n        Queries are automatically routed to the respective specialist.\n    </div>\n    \"\"\", unsafe_allow_html=True)\n\n    # Initialize chat history in session state\n    if \"agent_chat_messages\" not in st.session_state or not st.session_state.agent_chat_messages:\n        st.session_state.agent_chat_messages = [\n            {\n                \"role\": \"assistant\",\n                \"agent\": \"Coordinator Master Agent\",\n                \"badge_color\": \"#C084FC\",\n                \"content\": (\n                    \"All 5 autonomous agents are synchronized with active network telemetry. \"\n                    \"Ask any question about inventory runway, backup suppliers, customer demand tiers, or freight logistics.\"\n                )\n            }\n        ]\n\n    # Quick prompt buttons\n    st.markdown(\"<div style='font-size:0.68rem; color:#8B949E; text-transform:uppercase; font-weight:600; margin-bottom:4px;'>Quick Queries:</div>\", unsafe_allow_html=True)\n    q_col1, q_col2 = st.columns(2)\n    with q_col1:\n        if st.button(\"Inventory Runway?\", key=\"btn_q_inv\", use_container_width=True):\n            user_msg = \"What is our current inventory runway and starvation day?\"\n            agent_name, badge_color, agent_resp = route_and_generate_agent_response(user_msg)\n            st.session_state.agent_chat_messages.append({\"role\": \"user\", \"content\": user_msg})\n            st.session_state.agent_chat_messages.append({\"role\": \"assistant\", \"agent\": agent_name, \"badge_color\": badge_color, \"content\": agent_resp})\n            st.rerun()\n        if st.button(\"Customer SLA Tiers?\", key=\"btn_q_dem\", use_container_width=True):\n            user_msg = \"What customer demand tiers and SLA commitments are active?\"\n            agent_name, badge_color, agent_resp = route_and_generate_agent_response(user_msg)\n            st.session_state.agent_chat_messages.append({\"role\": \"user\", \"content\": user_msg})\n            st.session_state.agent_chat_messages.append({\"role\": \"assistant\", \"agent\": agent_name, \"badge_color\": badge_color, \"content\": agent_resp})\n            st.rerun()\n    with q_col2:\n        if st.button(\"Supplier Outages?\", key=\"btn_q_sup\", use_container_width=True):\n            user_msg = \"Which suppliers are disrupted and what backup capacity is available?\"\n            agent_name, badge_color, agent_resp = route_and_generate_agent_response(user_msg)\n            st.session_state.agent_chat_messages.append({\"role\": \"user\", \"content\": user_msg})\n            st.session_state.agent_chat_messages.append({\"role\": \"assistant\", \"agent\": agent_name, \"badge_color\": badge_color, \"content\": agent_resp})\n            st.rerun()\n        if st.button(\"Air vs Ground Freight?\", key=\"btn_q_log\", use_container_width=True):\n            user_msg = \"Why do we need expedited air freight instead of standard shipping?\"\n            agent_name, badge_color, agent_resp = route_and_generate_agent_response(user_msg)\n            st.session_state.agent_chat_messages.append({\"role\": \"user\", \"content\": user_msg})\n            st.session_state.agent_chat_messages.append({\"role\": \"assistant\", \"agent\": agent_name, \"badge_color\": badge_color, \"content\": agent_resp})\n            st.rerun()\n\n    # Chat history container\n    chat_container = st.container(height=280)\n    with chat_container:\n        for msg in st.session_state.agent_chat_messages:\n            if msg[\"role\"] == \"user\":\n                with st.chat_message(\"user\"):\n                    st.write(msg[\"content\"])\n            else:\n                with st.chat_message(\"assistant\"):\n                    agent_tag = msg.get(\"agent\", \"Agent\")\n                    badge_color = msg.get(\"badge_color\", \"#388BFD\")\n                    st.markdown(\n                        f\"<div style='display:inline-block; font-size:0.65rem; font-weight:700; color:{badge_color}; \"\n                        f\"background:rgba(56,139,253,0.1); border:1px solid {badge_color}; border-radius:4px; padding:1px 6px; margin-bottom:4px;'>\"\n                        f\"[{agent_tag.upper()}]</div>\",\n                        unsafe_allow_html=True\n                    )\n                    st.markdown(msg[\"content\"])\n\n    # Chat input\n    if user_query := st.chat_input(\"Ask the specialized agents...\"):\n        agent_name, badge_color, agent_resp = route_and_generate_agent_response(user_query)\n        st.session_state.agent_chat_messages.append({\"role\": \"user\", \"content\": user_query})\n        st.session_state.agent_chat_messages.append({\"role\": \"assistant\", \"agent\": agent_name, \"badge_color\": badge_color, \"content\": agent_resp})\n        st.rerun()\n\n    # Clear conversation button\n    if st.button(\"Clear Conversation\", use_container_width=True, key=\"btn_clear_agent_chat\"):\n        st.session_state.agent_chat_messages = []\n        st.rerun()\n\n\n# Levitating Floating Button Styles & Component\nst.markdown(\"\"\"\n<style>\n/* Levitating Floating Chat Trigger Button in Bottom Right Corner */\ndiv[class*=\"st-key-btn_floating_agent_chat\"] {\n    position: fixed !important;\n    bottom: 24px !important;\n    right: 24px !important;\n    z-index: 999998 !important;\n    animation: levitateAgentChat 3.2s ease-in-out infinite !important;\n}\ndiv[class*=\"st-key-btn_floating_agent_chat\"] button {\n    background: #161B22 !important;\n    border: 1.5px solid #388BFD !important;\n    border-radius: 28px !important;\n    color: #F0F6FC !important;\n    font-weight: 700 !important;\n    font-size: 0.82rem !important;\n    letter-spacing: 0.02em !important;\n    padding: 10px 18px !important;\n    box-shadow: 0 4px 18px rgba(56, 139, 253, 0.45) !important;\n    transition: all 0.2s ease !important;\n    display: flex !important;\n    align-items: center !important;\n    gap: 8px !important;\n}\ndiv[class*=\"st-key-btn_floating_agent_chat\"] button:hover {\n    background: #1C212B !important;\n    border-color: #58A6FF !important;\n    box-shadow: 0 8px 26px rgba(56, 139, 253, 0.70) !important;\n    transform: scale(1.04) !important;\n}\n@keyframes levitateAgentChat {\n    0% { transform: translateY(0px); }\n    50% { transform: translateY(-8px); }\n    100% { transform: translateY(0px); }\n}\n\n/* Floating Dialog Styling (Bottom-Right Popup Box) */\ndiv[data-testid=\"stDialog\"] div[role=\"dialog\"] {\n    position: fixed !important;\n    bottom: 24px !important;\n    right: 24px !important;\n    top: auto !important;\n    left: auto !important;\n    transform: none !important;\n    width: 440px !important;\n    max-width: calc(100vw - 32px) !important;\n    height: 590px !important;\n    max-height: calc(100vh - 48px) !important;\n    background: #161B22 !important;\n    border: 1px solid #30363D !important;\n    border-radius: 8px !important;\n    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85) !important;\n    display: flex !important;\n    flex-direction: column !important;\n    overflow: hidden !important;\n}\ndiv[data-testid=\"stDialog\"] {\n    background-color: transparent !important;\n}\n</style>\n\"\"\", unsafe_allow_html=True)\n\n# Render the floating levitating button in the bottom right corner\nif st.button(\"Chat with Agents\", key=\"btn_floating_agent_chat\", icon=\":material/smart_toy:\"):\n    show_agent_chat_dialog()\n\n\n\n",
  "pages/3_Recovery_Planner.py": "\"\"\"\nResilientAI - Page 3: Recovery Planner (Generating the Final Recovery Plan)\nActionable mitigation plan, multi-supplier allocations, cost breakdown, constraint validations, and HITL approval.\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nimport plotly.express as px\nimport plotly.graph_objects as go\nfrom datetime import datetime\nfrom core.state import init_session_state, record_audit\nfrom core.ui_components import apply_custom_css, render_metric_card\n\nst.set_page_config(page_title=\"Recovery Planner | ResilientAI\", layout=\"wide\")\napply_custom_css()\ninit_session_state()\n\nst.markdown('<div class=\"hero-badge\">PAGE 3 \u2022 RECOVERY PLANNER</div>', unsafe_allow_html=True)\nst.title(\"Autonomous Recovery Plan & Execution\")\nst.caption(\"Actionable multi-sourcing allocations, freight schedules, constraint validation, and human planner approval.\")\n\nplan = st.session_state.recovery_plan\nscenario = st.session_state.active_scenario\n\n# Executive Summary\nst.info(f\"**Coordinator Strategy Synthesis**: {plan.executive_summary}\")\n\n# High-Level Metrics\nm1, m2, m3, m4 = st.columns(4)\nwith m1:\n    render_metric_card(\"Service Fulfillment\", f\"{plan.fulfillment_rate}%\", \"Tier 1: 100% Guaranteed\", \"green\")\nwith m2:\n    render_metric_card(\"Total Landed Cost\", f\"${plan.total_landed_cost:,.0f}\", f\"Purchasing: ${plan.total_material_cost:,.0f}\", \"blue\")\nwith m3:\n    render_metric_card(\"Unmet Backorders\", f\"{plan.unmet_demand_units} Units\", \"Deferred non-critical Tier 3\", \"green\" if plan.unmet_demand_units < 100 else \"amber\")\nwith m4:\n    render_metric_card(\"Recovery Horizon\", f\"{plan.recovery_time_days} Days\", \"Full stock stabilization\", \"blue\")\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Sourcing Allocation Table and Cost Breakdown\ncol_alloc, col_cost = st.columns([3, 2])\n\nwith col_alloc:\n    with st.container(border=True):\n        st.markdown(\"#### Recommended Purchase & Dispatch Schedule\")\n        st.caption(\"Volume allocations split between backup vendors to satisfy demand and avoid single-vendor bottlenecks.\")\n        \n        alloc_table = []\n        for a in plan.allocations:\n            alloc_table.append({\n                \"Supplier\": a.supplier_name,\n                \"Shipping Mode\": \"Air Expedited\" if \"EXPEDITED\" in a.shipping_mode else \"Standard Freight\",\n                \"Allocated Units\": f\"{a.allocated_units:,}\",\n                \"Lead Time\": f\"{a.lead_time_days} Days\",\n                \"Arrival Day\": f\"Day {a.arrival_day}\",\n                \"Unit Price\": f\"${a.unit_cost:.2f}\",\n                \"Freight / Unit\": f\"${a.freight_cost_per_unit:.2f}\",\n                \"Total PO Spend\": f\"${a.total_cost:,.2f}\"\n            })\n        st.dataframe(pd.DataFrame(alloc_table), hide_index=True, use_container_width=True)\n\nwith col_cost:\n    with st.container(border=True):\n        st.markdown(\"#### Landed Cost Decomposition\")\n        cost_df = pd.DataFrame([\n            {\"Category\": \"Material Purchasing\", \"Amount\": plan.total_material_cost},\n            {\"Category\": \"Freight & Expedite\", \"Amount\": plan.total_freight_cost},\n            {\"Category\": \"Inventory Holding\", \"Amount\": plan.total_holding_cost},\n            {\"Category\": \"Backorder SLA Penalties\", \"Amount\": plan.total_backorder_penalty}\n        ])\n        fig_cost = px.pie(\n            cost_df,\n            values=\"Amount\",\n            names=\"Category\",\n            hole=0.45,\n            color_discrete_sequence=[\"#38bdf8\", \"#f59e0b\", \"#64748b\", \"#f43f5e\"]\n        )\n        fig_cost.update_layout(margin=dict(l=10, r=10, t=10, b=10), height=260, paper_bgcolor=\"rgba(0,0,0,0)\")\n        st.plotly_chart(fig_cost, use_container_width=True)\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Constraint Validation Section\nst.markdown(\"### Hard Constraint & SLA Validation Engine\")\nst.caption(\"Verifies mathematical bounds, supplier physical capacity, lead-time feasibility, and budget ceilings.\")\n\nc_cols = st.columns(len(plan.constraints_status))\nfor idx, c in enumerate(plan.constraints_status):\n    with c_cols[idx]:\n        with st.container(border=True):\n            badge_class = \"badge-passed\" if c.status == \"PASSED\" else (\"badge-warning\" if c.status == \"WARNING\" else \"badge-violated\")\n            st.markdown(f'<span class=\"{badge_class}\">{c.status}</span>', unsafe_allow_html=True)\n            st.markdown(f\"**{c.constraint_name}**\")\n            st.caption(c.message)\n            st.markdown(f\"<span style='font-size:0.8rem; color:#94a3b8;'>Value: <b>{c.metric_value}</b><br>Threshold: <b>{c.threshold}</b></span>\", unsafe_allow_html=True)\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Human-in-the-Loop Planner Decision Form\nst.markdown(\"### Human-in-the-Loop (HITL) Planner Approval Gating\")\nst.caption(\"ResilientAI requires explicit human authorization before executing supplier allocations into the enterprise ERP.\")\n\nwith st.container(border=True):\n    current_status = st.session_state.plan_approval_status\n    status_color = \"#10b981\" if current_status == \"APPROVED\" else (\"#ef4444\" if current_status == \"REJECTED\" else \"#f59e0b\")\n    \n    st.markdown(f\"\"\"\n    <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;\">\n        <div>\n            <span style=\"font-weight: 700; color: #f8fafc; font-size: 1.1rem;\">Current Status: </span>\n            <span style=\"color: {status_color}; font-weight: 800; font-size: 1.1rem; border: 1px solid {status_color}; padding: 2px 10px; border-radius: 6px;\">\n                {current_status.replace('_', ' ')}\n            </span>\n        </div>\n        <div style=\"font-size: 0.85rem; color: #94a3b8;\">\n            Audit-tracked action \u2022 Immutable log\n        </div>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n    \n    col_p1, col_p2 = st.columns([1, 2])\n    with col_p1:\n        planner_name = st.text_input(\"Planner Name / Badge ID\", value=\"Lead Planner (Operations)\")\n    with col_p2:\n        approval_notes = st.text_input(\"Decision Notes / Rationale\", value=\"Approved dual-sourcing allocation with Phase 1 air expediting to prevent plant starvation.\")\n        \n    btn_approve, btn_reject, _ = st.columns([1, 1, 2])\n    with btn_approve:\n        if st.button(\"Approve Recovery Plan\", use_container_width=True, type=\"primary\"):\n            st.session_state.plan_approval_status = \"APPROVED\"\n            record_audit(\"PLAN_APPROVED\", planner_name, approval_notes)\n            st.toast(\"Recovery plan approved and logged to audit trail!\")\n            st.rerun()\n            \n    with btn_reject:\n        if st.button(\"Reject Plan (Request Revision)\", use_container_width=True):\n            st.session_state.plan_approval_status = \"REJECTED\"\n            record_audit(\"PLAN_REJECTED\", planner_name, approval_notes)\n            st.toast(\"Plan rejected. Revision requested.\")\n            st.rerun()\n",
  "pages/4_What_If_Simulator.py": "\"\"\"\nResilientAI - Page 4: What-If Simulator (Testing Alternative Scenarios)\nStress-test supply chain scenarios with dynamic parameters and side-by-side impact comparison.\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nimport plotly.graph_objects as go\nfrom plotly.subplots import make_subplots\nfrom core.state import init_session_state, record_audit, run_multi_agent_workflow\nfrom core.models import DisruptionScenario\nfrom core.optimization.solver import SupplyChainOptimizer\nfrom core.ui_components import apply_custom_css, render_metric_card\n\nst.set_page_config(page_title=\"What-If Simulator | ResilientAI\", layout=\"wide\")\napply_custom_css()\ninit_session_state()\n\nst.markdown('<div class=\"hero-badge\">PAGE 4 \u2022 WHAT-IF SIMULATOR</div>', unsafe_allow_html=True)\nst.title(\"What-If Scenario Stress Testing\")\nst.caption(\"Simulate varying disruption durations, demand surges, backup vendor constraints, and compare outcomes side-by-side with real-time MILP optimization.\")\n\nsuppliers_df = st.session_state.suppliers_df\ninventory_df = st.session_state.inventory_df\ndemand_df = st.session_state.demand_df\n\noptimizer = SupplyChainOptimizer(\n    suppliers_df,\n    inventory_df,\n    demand_df\n)\n\nactive_scen = st.session_state.active_scenario\ndisrupted_id = active_scen.disrupted_supplier_id if active_scen.disrupted_supplier_id in suppliers_df['supplier_id'].values else suppliers_df['supplier_id'].iloc[0]\n\n# Safe supplier name helper\ndef get_supplier_display_name(row_or_series) -> str:\n    if isinstance(row_or_series, pd.Series) or isinstance(row_or_series, dict):\n        return str(row_or_series.get(\"supplier_name\") or row_or_series.get(\"name\") or row_or_series.get(\"supplier_id\", \"Supplier\"))\n    return \"Supplier\"\n\ndisrupted_match = suppliers_df[suppliers_df['supplier_id'] == disrupted_id]\ndisrupted_name = get_supplier_display_name(disrupted_match.iloc[0]) if not disrupted_match.empty else disrupted_id\nbackup_suppliers = suppliers_df[suppliers_df['supplier_id'] != disrupted_id]\n\n# Standard 7-Day Baseline Plan\nbaseline_scenario = DisruptionScenario(disrupted_supplier_id=disrupted_id, duration_days=7, demand_shock_pct=0.0)\nbaseline_plan = optimizer.solve_resilient_ai_plan(baseline_scenario)\n\n# Simulation Parameters Panel\nwith st.container(border=True):\n    st.markdown(\"#### Simulation Parameters & Network Stress Levers\")\n    col_p1, col_p2, col_p3 = st.columns(3)\n    \n    with col_p1:\n        st.markdown(\"**Disruption Duration & Demand**\")\n        sim_duration = st.slider(\n            f\"Outage Duration for {disrupted_name} (Days)\",\n            min_value=3,\n            max_value=14,\n            value=int(active_scen.duration_days) if 3 <= active_scen.duration_days <= 14 else 7,\n            step=1,\n            key=\"slider_sim_duration\"\n        )\n        sim_demand_shock = st.slider(\n            \"Customer Demand Shock (%)\",\n            min_value=-30,\n            max_value=50,\n            value=int(active_scen.demand_shock_pct) if -30 <= active_scen.demand_shock_pct <= 50 else 0,\n            step=5,\n            key=\"slider_sim_demand_shock\"\n        )\n        \n    with col_p2:\n        st.markdown(\"**Secondary Supplier Daily Capacities**\")\n        cap_overrides = {}\n        if len(backup_suppliers) >= 1:\n            b_sup = backup_suppliers.iloc[0]\n            b_name = get_supplier_display_name(b_sup)\n            b_id = b_sup[\"supplier_id\"]\n            b_default_cap = int(b_sup.get(\"daily_capacity\", 350))\n            sim_cap_b = st.slider(\n                f\"{b_name} Capacity (u/day)\",\n                min_value=max(50, int(b_default_cap * 0.4)),\n                max_value=max(200, int(b_default_cap * 1.8)),\n                value=b_default_cap,\n                step=25,\n                key=\"slider_sim_cap_b\"\n            )\n            cap_overrides[b_id] = sim_cap_b\n        else:\n            sim_cap_b = 350\n\n        if len(backup_suppliers) >= 2:\n            c_sup = backup_suppliers.iloc[1]\n            c_name = get_supplier_display_name(c_sup)\n            c_id = c_sup[\"supplier_id\"]\n            c_default_cap = int(c_sup.get(\"daily_capacity\", 300))\n            sim_cap_c = st.slider(\n                f\"{c_name} Capacity (u/day)\",\n                min_value=max(50, int(c_default_cap * 0.4)),\n                max_value=max(200, int(c_default_cap * 1.8)),\n                value=c_default_cap,\n                step=25,\n                key=\"slider_sim_cap_c\"\n            )\n            cap_overrides[c_id] = sim_cap_c\n        else:\n            sim_cap_c = 300\n        \n    with col_p3:\n        st.markdown(\"**Logistics Modes & Simulation Run**\")\n        sim_expedite = st.toggle(\"Enable Air Freight Expediting\", value=True, key=\"toggle_sim_expedite\")\n        st.markdown(\"<div style='height: 12px;'></div>\", unsafe_allow_html=True)\n        run_sim = st.button(\"Simulate Revised Scenario\", use_container_width=True, type=\"primary\", key=\"btn_run_sim\")\n        if run_sim:\n            st.toast(\"Simulation executed: parameters evaluated against optimization engine.\", icon=\"check_circle\")\n\n# Execute revised simulation with dynamic overrides\nrevised_scenario = DisruptionScenario(\n    disrupted_supplier_id=disrupted_id,\n    duration_days=sim_duration,\n    demand_shock_pct=float(sim_demand_shock),\n    supplier_b_capacity_override=sim_cap_b,\n    supplier_c_capacity_override=sim_cap_c,\n    supplier_capacity_overrides=cap_overrides,\n    expedite_available=sim_expedite\n)\nrevised_plan = optimizer.solve_resilient_ai_plan(revised_scenario)\n\n# Active status indicator\nis_diverged = (\n    sim_duration != baseline_scenario.duration_days or\n    sim_demand_shock != baseline_scenario.demand_shock_pct or\n    not sim_expedite or\n    (len(backup_suppliers) >= 1 and sim_cap_b != int(backup_suppliers.iloc[0].get(\"daily_capacity\", 350))) or\n    (len(backup_suppliers) >= 2 and sim_cap_c != int(backup_suppliers.iloc[1].get(\"daily_capacity\", 300)))\n)\n\nstatus_badge_color = \"#D29922\" if is_diverged else \"#238636\"\nstatus_text = f\"Stress Testing Active: {sim_duration}d Outage, {sim_demand_shock:+}% Demand, Expediting {'ON' if sim_expedite else 'OFF'}\" if is_diverged else \"Baseline Parameters Active: Nominal 7-day disruption\"\n\nst.markdown(f\"\"\"\n<div style=\"background:#161B22; border:1px solid #30363D; border-left:3px solid {status_badge_color}; border-radius:6px; padding:8px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;\">\n    <span style=\"font-size:0.80rem; font-weight:600; color:#E6EDF3;\">{status_text}</span>\n    <span style=\"font-size:0.72rem; color:#8B949E; font-family:'JetBrains Mono', monospace;\">Target: {disrupted_name}</span>\n</div>\n\"\"\", unsafe_allow_html=True)\n\nst.markdown(\"### Side-by-Side Scenario Comparison\")\n\n# Side-by-side delta cards\nc_base, c_rev = st.columns(2)\n\nwith c_base:\n    with st.container(border=True):\n        st.markdown(\"#### Baseline Scenario (Standard 7-Day Outage)\")\n        st.caption(f\"Standard 7-day shutdown of {disrupted_name}, nominal demand, standard backup allocation.\")\n        \n        b1, b2 = st.columns(2)\n        with b1:\n            render_metric_card(\"Fulfillment Rate\", f\"{baseline_plan.fulfillment_rate}%\", \"Tier 1: 100% Protected\", \"green\")\n            render_metric_card(\"Stockout Days\", f\"{baseline_plan.stockout_duration_days} Days\", \"Runway gap bridged\", \"blue\")\n        with b2:\n            render_metric_card(\"Total Landed Cost\", f\"${baseline_plan.total_landed_cost:,.0f}\", \"Baseline Spend\", \"blue\")\n            render_metric_card(\"Unmet Demand\", f\"{baseline_plan.unmet_demand_units} Units\", \"Minimal backlog\", \"green\")\n\nwith c_rev:\n    with st.container(border=True):\n        st.markdown(f\"#### What-If Revised Scenario ({sim_duration}d Outage, {sim_demand_shock:+}% Demand)\")\n        st.caption(f\"Backup 1 ({sim_cap_b}/d), Backup 2 ({sim_cap_c}/d), Expedite: {'On' if sim_expedite else 'Off'}.\")\n        \n        # Calculate deltas\n        cost_delta = revised_plan.total_landed_cost - baseline_plan.total_landed_cost\n        cost_sign = \"+\" if cost_delta >= 0 else \"-\"\n        fill_delta = round(revised_plan.fulfillment_rate - baseline_plan.fulfillment_rate, 1)\n        fill_sign = \"+\" if fill_delta >= 0 else \"\"\n        unmet_delta = revised_plan.unmet_demand_units - baseline_plan.unmet_demand_units\n        stockout_delta = revised_plan.stockout_duration_days - baseline_plan.stockout_duration_days\n        \n        r1, r2 = st.columns(2)\n        with r1:\n            render_metric_card(\n                \"Fulfillment Rate\", \n                f\"{revised_plan.fulfillment_rate}%\", \n                f\"Delta: {fill_sign}{fill_delta}%\", \n                \"green\" if fill_delta >= 0 else \"red\"\n            )\n            render_metric_card(\n                \"Stockout Days\", \n                f\"{revised_plan.stockout_duration_days} Days\", \n                f\"{'Zero starvation' if revised_plan.stockout_duration_days == 0 else f'+{stockout_delta} Days Starvation' if stockout_delta > 0 else 'Stockout eliminated'}\", \n                \"green\" if revised_plan.stockout_duration_days == 0 else \"red\"\n            )\n        with r2:\n            render_metric_card(\n                \"Total Landed Cost\", \n                f\"${revised_plan.total_landed_cost:,.0f}\", \n                f\"Delta: {cost_sign}${abs(cost_delta):,.0f}\", \n                \"amber\" if cost_delta > 0 else \"blue\"\n            )\n            render_metric_card(\n                \"Unmet Demand\", \n                f\"{revised_plan.unmet_demand_units} Units\", \n                f\"Delta: {unmet_delta:+d} units\", \n                \"green\" if revised_plan.unmet_demand_units == 0 else \"red\"\n            )\n\nst.markdown(\"<div style='height: 12px;'></div>\", unsafe_allow_html=True)\n\n# Comparative Charts & Rationale\ncol_ch1, col_ch2 = st.columns([1.1, 0.9])\n\nwith col_ch1:\n    with st.container(border=True):\n        st.markdown(\"#### Dual-Metric Operational Comparison\")\n        st.caption(\"Fulfillment rate and landed cost compared across baseline vs revised stress-test.\")\n        \n        fig = make_subplots(\n            rows=1, cols=2,\n            subplot_titles=[\"Fulfillment Rate (%)\", \"Total Landed Cost ($)\"],\n            horizontal_spacing=0.18\n        )\n        \n        # Subplot 1: Fulfillment Rate\n        fig.add_trace(\n            go.Bar(\n                name=\"Baseline\",\n                x=[\"Baseline\", \"Revised\"],\n                y=[baseline_plan.fulfillment_rate, revised_plan.fulfillment_rate],\n                text=[f\"{baseline_plan.fulfillment_rate}%\", f\"{revised_plan.fulfillment_rate}%\"],\n                textposition=\"auto\",\n                marker_color=[\"#388BFD\", \"#238636\" if revised_plan.fulfillment_rate >= baseline_plan.fulfillment_rate else \"#DA3633\"],\n                showlegend=False\n            ),\n            row=1, col=1\n        )\n        \n        # Subplot 2: Total Landed Cost\n        fig.add_trace(\n            go.Bar(\n                name=\"Cost\",\n                x=[\"Baseline\", \"Revised\"],\n                y=[baseline_plan.total_landed_cost, revised_plan.total_landed_cost],\n                text=[f\"${baseline_plan.total_landed_cost:,.0f}\", f\"${revised_plan.total_landed_cost:,.0f}\"],\n                textposition=\"auto\",\n                marker_color=[\"#388BFD\", \"#D29922\" if revised_plan.total_landed_cost > baseline_plan.total_landed_cost else \"#238636\"],\n                showlegend=False\n            ),\n            row=1, col=2\n        )\n        \n        fig.update_layout(\n            height=280,\n            margin=dict(l=20, r=20, t=30, b=20),\n            plot_bgcolor=\"#0D1117\",\n            paper_bgcolor=\"#161B22\",\n            font=dict(color=\"#E6EDF3\", size=11, family=\"Inter, sans-serif\"),\n        )\n        fig.update_xaxes(showgrid=False, linecolor=\"#30363D\")\n        fig.update_yaxes(gridcolor=\"#21262D\", linecolor=\"#30363D\")\n        \n        st.plotly_chart(fig, use_container_width=True)\n\nwith col_ch2:\n    with st.container(border=True):\n        st.markdown(\"#### Dynamic Agent Rationale Explanation\")\n        st.caption(\"Root-cause synthesis from the Multi-Agent Coordinator explaining metric deltas:\")\n        \n        avg_demand = int(demand_df['demand_units'].mean()) if 'demand_units' in demand_df.columns else (int(demand_df['daily_demand'].mean()) if 'daily_demand' in demand_df.columns else 400)\n        explanation = []\n        \n        if sim_duration > 7:\n            explanation.append(f\"\u2022 **Extended Outage ({sim_duration} days)**: Primary recovery is deferred to Day {sim_duration + 1}. Requires sustained backup supplier replenishment to prevent assembly line starvation.\")\n        elif sim_duration < 7:\n            explanation.append(f\"\u2022 **Shortened Outage ({sim_duration} days)**: Early recovery on Day {sim_duration + 1} reduces required reliance on secondary vendors, lowering freight expedite premiums.\")\n            \n        if sim_demand_shock > 0:\n            burn = int(avg_demand * (1 + sim_demand_shock / 100))\n            explanation.append(f\"\u2022 **Demand Surge (+{sim_demand_shock}%)**: Daily consumption spikes to ~{burn:,} units/day, exhausting safety buffer faster and risking Tier 2/3 customer backorders.\")\n        elif sim_demand_shock < 0:\n            explanation.append(f\"\u2022 **Demand Contraction ({sim_demand_shock}%)**: Lower customer consumption extends existing warehouse runway, lessening required replenishment urgency.\")\n            \n        if len(backup_suppliers) >= 1 and sim_cap_b < backup_suppliers.iloc[0].get('daily_capacity', 350):\n            b_n = get_supplier_display_name(backup_suppliers.iloc[0])\n            explanation.append(f\"\u2022 **{b_n} Capacity Cap ({sim_cap_b} u/d)**: Restricts primary backup dispatch volume, shifting order allocation to secondary vendors or risking backlogs.\")\n            \n        if not sim_expedite:\n            explanation.append(\"\u2022 **Air Expediting Disabled**: Restricts network to standard transit (4-5 days lead time). Stockout gap cannot be closed before warehouse buffer runs out, causing production halts.\")\n            \n        if not explanation:\n            explanation.append(\"\u2022 Parameters match nominal baseline conditions. Dual-sourcing split across qualified backup vendors achieves optimal SLA balance.\")\n            \n        for exp in explanation:\n            st.markdown(f\"<div style='font-size:0.78rem; line-height:1.45; color:#C9D1D9; margin-bottom:6px;'>{exp}</div>\", unsafe_allow_html=True)\n            \n        st.markdown(\"<div style='height: 8px;'></div>\", unsafe_allow_html=True)\n        \n        if st.button(\"Apply What-If Parameters as Active Scenario\", type=\"primary\", use_container_width=True, key=\"btn_apply_what_if\"):\n            st.session_state.active_scenario = revised_scenario\n            st.session_state.recovery_plan = revised_plan\n            \n            # Synchronize the full multi-agent workflow across all pages\n            run_multi_agent_workflow()\n            \n            record_audit(\n                action=\"WHAT_IF_TESTED\",\n                planner_id=\"Operations Planner\",\n                notes=f\"Applied What-If: {sim_duration}d outage for {disrupted_id}, {sim_demand_shock:+}% demand, Expedite={'ON' if sim_expedite else 'OFF'}.\"\n            )\n            st.toast(\"Active scenario updated across Command Center, Agent Workspace, and Planner.\", icon=\"check_circle\")\n            st.success(\"Successfully updated active scenario across all application pages.\")\n            st.rerun()\n",
  "pages/5_Performance_Audit.py": "\"\"\"\nResilientAI - Page 5: Performance & Audit (Measuring and Explaining Results)\nTri-way benchmark comparison against baselines and immutable decision history audit trail.\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nimport plotly.express as px\nimport plotly.graph_objects as go\nfrom core.state import init_session_state\nfrom core.ui_components import apply_custom_css, render_metric_card\n\nst.set_page_config(page_title=\"Performance & Audit | ResilientAI\", layout=\"wide\")\napply_custom_css()\ninit_session_state()\n\nst.markdown('<div class=\"hero-badge\">PAGE 5 \u2022 PERFORMANCE & AUDIT</div>', unsafe_allow_html=True)\nst.title(\"Performance Benchmarking & Decision Audit\")\nst.caption(\"Quantitative tri-way evaluation against traditional supply chain baselines and immutable governance audit log.\")\n\nbenchmark = st.session_state.benchmark_results\ncomp_df = benchmark[\"comparison_df\"]\nplan = benchmark[\"resilient_plan\"]\n\n# Top Value Delivered Metrics\nv1, v2, v3 = st.columns(3)\nwith v1:\n    render_metric_card(\n        \"Cost Savings vs No-Action\",\n        f\"${benchmark['cost_savings_vs_no_action']:,.0f}\",\n        \"Averted catastrophic shutdown & SLA penalties\",\n        \"green\"\n    )\nwith v2:\n    render_metric_card(\n        \"Cost Savings vs Rule-Based ERP\",\n        f\"${benchmark['cost_savings_vs_rule_based']:,.0f}\",\n        \"Avoided stockout via proactive expediting\",\n        \"green\"\n    )\nwith v3:\n    render_metric_card(\n        \"Fulfillment Rate Uplift\",\n        f\"+{benchmark['fill_rate_gain_pct']}%\",\n        f\"Reached {plan.fulfillment_rate}% OTIF service level\",\n        \"blue\"\n    )\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Tri-Way Strategy Benchmark Table\nst.markdown(\"### Tri-Way Benchmark Evaluation Matrix\")\nst.caption(\"Evaluating No-Action, Rule-Based Reorder (s, S Heuristic), and ResilientAI over identical disruption conditions.\")\n\n# Format dataframe for display\ndisplay_df = comp_df.copy()\ndisplay_df[\"Total Landed Cost ($)\"] = display_df[\"Total Landed Cost ($)\"].apply(lambda x: f\"${x:,.0f}\")\ndisplay_df[\"Unmet Demand (Units)\"] = display_df[\"Unmet Demand (Units)\"].apply(lambda x: f\"{x:,}\")\n\nst.dataframe(display_df, hide_index=True, use_container_width=True)\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Comparative Visualizations\ncol_b1, col_b2 = st.columns([1, 1])\n\nwith col_b1:\n    with st.container(border=True):\n        st.markdown(\"#### Fulfillment Rate Across Strategies\")\n        fig_fill = px.bar(\n            comp_df,\n            x=\"Strategy\",\n            y=\"Fulfillment Rate (%)\",\n            color=\"Strategy\",\n            color_discrete_sequence=[\"#ef4444\", \"#f59e0b\", \"#10b981\"],\n            text=\"Fulfillment Rate (%)\"\n        )\n        fig_fill.update_traces(texttemplate='%{text:.1f}%', textposition='outside')\n        fig_fill.update_layout(height=280, margin=dict(l=10, r=10, t=20, b=10), showlegend=False, plot_bgcolor=\"rgba(15, 23, 42, 0.4)\", paper_bgcolor=\"rgba(0,0,0,0)\")\n        st.plotly_chart(fig_fill, use_container_width=True)\n\nwith col_b2:\n    with st.container(border=True):\n        st.markdown(\"#### Total Landed Cost & Penalties ($)\")\n        fig_cost = px.bar(\n            comp_df,\n            x=\"Strategy\",\n            y=\"Total Landed Cost ($)\",\n            color=\"Strategy\",\n            color_discrete_sequence=[\"#ef4444\", \"#f59e0b\", \"#38bdf8\"],\n            text=\"Total Landed Cost ($)\"\n        )\n        fig_cost.update_traces(texttemplate='$%{y:,.0f}', textposition='outside')\n        fig_cost.update_layout(height=280, margin=dict(l=10, r=10, t=20, b=10), showlegend=False, plot_bgcolor=\"rgba(15, 23, 42, 0.4)\", paper_bgcolor=\"rgba(0,0,0,0)\")\n        st.plotly_chart(fig_cost, use_container_width=True)\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Governance & Decision History Audit Trail\nst.markdown(\"### Governance & Human Decision History Audit Trail\")\nst.caption(\"Immutable log of scenario changes, model runs, planner approvals, and overrides.\")\n\naudit_records = st.session_state.audit_history\naudit_data = [\n    {\n        \"Timestamp\": a.timestamp,\n        \"Action Taken\": a.action,\n        \"Planner ID\": a.planner_id,\n        \"Scenario Context\": a.scenario_summary,\n        \"Projected Cost\": f\"${a.plan_cost:,.2f}\" if a.plan_cost > 0 else \"N/A\",\n        \"Fill Rate\": f\"{a.fill_rate}%\" if a.fill_rate > 0 else \"N/A\",\n        \"Planner Notes & Rationale\": a.notes\n    }\n    for a in audit_records\n]\n\nst.dataframe(pd.DataFrame(audit_data), hide_index=True, use_container_width=True)\n",
  "pages/6_Supply_Chain_Data.py": "\"\"\"\nResilientAI - Page 6: Supply Chain Data (Inspecting Underlying Information)\nTransparent data browser, search/filtering, CSV export/import, and dynamic dataset generator.\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nimport random\nfrom core.state import init_session_state, run_multi_agent_workflow, apply_mock_dataset\nfrom core.data_loader import (\n    get_default_suppliers_df, get_default_inventory_df, get_default_demand_df,\n    get_default_bom_df\n)\nfrom core.mock_data_generator import (\n    generate_scenario_dataset, INDUSTRY_PRESETS, MockDataGenerator\n)\nfrom core.models import DisruptionScenario\nfrom core.ui_components import apply_custom_css\n\nst.set_page_config(page_title=\"Supply Chain Data | ResilientAI\", layout=\"wide\")\napply_custom_css()\ninit_session_state()\n\nst.markdown('<div class=\"hero-badge\">PAGE 6 \u2022 DATA REPOSITORY & GENERATOR</div>', unsafe_allow_html=True)\nst.title(\"Supply Chain Master Data & Scenario Generator\")\nst.caption(\"Inspect underlying datasets, export schemas, or generate custom synthetic supply chain topologies across industry presets.\")\n\n# Interactive Scenario & Mock Data Generator\nwith st.container(border=True):\n    st.markdown(\"#### Synthetic Network & Mock Data Generator\")\n    st.caption(\"Generate realistic parametric datasets to evaluate how the multi-agent system adapts to distinct industry operating conditions.\")\n\n    preset_options = {\n        \"industrial_iot\": \"Industrial IoT Gateways (Standard)\",\n        \"automotive_ev\": \"Automotive & EV Battery Powertrain\",\n        \"aerospace_defense\": \"Aerospace & Defense Avionics\",\n        \"medical_devices\": \"Life-Critical Medical Diagnostics\"\n    }\n\n    g_col1, g_col2, g_col3 = st.columns([1, 1, 1])\n\n    with g_col1:\n        selected_preset = st.selectbox(\n            \"Industry Ecosystem Preset\",\n            options=list(preset_options.keys()),\n            format_func=lambda k: preset_options[k],\n            index=0\n        )\n        disruption_sev = st.select_slider(\n            \"Disruption Severity\",\n            options=[\"low\", \"medium\", \"high\", \"critical\"],\n            value=\"critical\"\n        )\n\n    with g_col2:\n        outage_duration = st.slider(\n            \"Supplier Outage Duration (Days)\",\n            min_value=3,\n            max_value=14,\n            value=7,\n            step=1\n        )\n        volatility_choice = st.select_slider(\n            \"Demand Volatility\",\n            options=[\"stable\", \"moderate\", \"high\"],\n            value=\"stable\"\n        )\n\n    with g_col3:\n        buffer_days = st.slider(\n            \"Initial Inventory Buffer (Days)\",\n            min_value=1.0,\n            max_value=8.0,\n            value=2.1,\n            step=0.1\n        )\n        randomize_seed = st.checkbox(\"Randomize Seed (Stochastic Generation)\", value=False)\n        seed_val = random.randint(1, 99999) if randomize_seed else 42\n\n    st.markdown(\"<br>\", unsafe_allow_html=True)\n    if st.button(\"Generate & Apply Custom Dataset\", type=\"primary\", use_container_width=True):\n        new_dataset = generate_scenario_dataset(\n            preset=selected_preset,\n            num_suppliers=4,\n            disruption_severity=disruption_sev,\n            demand_volatility=volatility_choice,\n            inventory_buffer_days=buffer_days,\n            seed=seed_val\n        )\n        new_scenario = DisruptionScenario(\n            disrupted_supplier_id=new_dataset[\"disrupted_supplier_id\"],\n            duration_days=outage_duration,\n            capacity_drop_pct=100.0,\n            demand_shock_pct=0.0\n        )\n        apply_mock_dataset(\n            dataset_bundle=new_dataset,\n            scenario=new_scenario,\n            notes=f\"Generated {preset_options[selected_preset]} dataset (Severity: {disruption_sev}, Buffer: {buffer_days}d, Outage: {outage_duration}d)\"\n        )\n        st.toast(f\"Successfully loaded {preset_options[selected_preset]} dataset across all modules!\")\n        st.rerun()\n\nst.markdown(\"<br>\", unsafe_allow_html=True)\n\n# Dataset Master Tabs\ntab_sup, tab_inv, tab_dem, tab_bom = st.tabs([\n    \"Suppliers Master Data\",\n    \"Plant Inventory Buffers\",\n    \"Customer Demand & Orders\",\n    \"Bill of Materials (BOM)\"\n])\n\n# 1. Suppliers Tab\nwith tab_sup:\n    st.markdown(\"#### Tier-1 & Tier-2 Suppliers Dataset\")\n    st.caption(\"Contains physical capacities, lead times, freight rates, unit costs, and reliability ratings.\")\n    \n    col_s_f1, col_s_f2 = st.columns([2, 1])\n    with col_s_f1:\n        search_sup = st.text_input(\"Search Suppliers by Name or Component\", \"\")\n    with col_s_f2:\n        st.markdown(\"<br>\", unsafe_allow_html=True)\n        csv_sup = st.session_state.suppliers_df.to_csv(index=False).encode('utf-8')\n        st.download_button(\"Export Suppliers CSV\", data=csv_sup, file_name=\"suppliers_master.csv\", mime=\"text/csv\")\n        \n    df_s = st.session_state.suppliers_df.copy()\n    if search_sup:\n        name_col = \"supplier_name\" if \"supplier_name\" in df_s.columns else \"name\"\n        comp_col = \"critical_component\" if \"critical_component\" in df_s.columns else \"component\"\n        mask = (df_s[name_col].astype(str).str.contains(search_sup, case=False)) | (df_s[comp_col].astype(str).str.contains(search_sup, case=False))\n        df_s = df_s[mask]\n        \n    st.dataframe(df_s, use_container_width=True, hide_index=True)\n\n# 2. Inventory Tab\nwith tab_inv:\n    st.markdown(\"#### Facility Inventory & Storage Buffers\")\n    st.caption(\"On-hand stock levels, safety thresholds, consumption burn rates, and unit holding costs.\")\n    \n    csv_inv = st.session_state.inventory_df.to_csv(index=False).encode('utf-8')\n    st.download_button(\"Export Inventory CSV\", data=csv_inv, file_name=\"inventory_buffers.csv\", mime=\"text/csv\")\n    st.dataframe(st.session_state.inventory_df, use_container_width=True, hide_index=True)\n\n# 3. Demand Tab\nwith tab_dem:\n    st.markdown(\"#### Customer Orders & SLA Schedule (14-Day Horizon)\")\n    st.caption(\"Daily order volume by customer tier and unfulfilled backorder penalties.\")\n    \n    c_df1, c_df2 = st.columns([1, 1])\n    with c_df1:\n        available_tiers = sorted(st.session_state.demand_df[\"customer_tier\"].unique().tolist()) if \"customer_tier\" in st.session_state.demand_df.columns else [1, 2, 3]\n        tier_filter = st.multiselect(\"Filter by Customer Tier\", options=available_tiers, default=available_tiers)\n    with c_df2:\n        st.markdown(\"<br>\", unsafe_allow_html=True)\n        csv_dem = st.session_state.demand_df.to_csv(index=False).encode('utf-8')\n        st.download_button(\"Export Demand CSV\", data=csv_dem, file_name=\"demand_schedule.csv\", mime=\"text/csv\")\n        \n    tier_col = \"customer_tier\" if \"customer_tier\" in st.session_state.demand_df.columns else \"tier\"\n    df_d = st.session_state.demand_df[st.session_state.demand_df[tier_col].isin(tier_filter)]\n    st.dataframe(df_d, use_container_width=True, hide_index=True)\n\n# 4. BOM Tab\nwith tab_bom:\n    st.markdown(\"#### Bill of Materials (BOM) & Network Architecture\")\n    st.caption(\"Structural dependencies for finished goods assembly at Plant Alpha.\")\n    \n    bom_df = st.session_state.get(\"bom_df\", get_default_bom_df())\n    st.dataframe(bom_df, use_container_width=True, hide_index=True)\n\nst.markdown(\"---\")\n# Reset dataset button\nif st.button(\"Reset All Data to Standard Benchmark\"):\n    st.session_state.suppliers_df = get_default_suppliers_df()\n    st.session_state.inventory_df = get_default_inventory_df()\n    st.session_state.demand_df = get_default_demand_df()\n    st.session_state.bom_df = get_default_bom_df()\n    st.session_state.active_scenario = DisruptionScenario(\n        disrupted_supplier_id=\"SUP-A\",\n        duration_days=7,\n        capacity_drop_pct=100.0,\n        demand_shock_pct=0.0\n    )\n    run_multi_agent_workflow()\n    st.success(\"All datasets reset to standard benchmark default.\")\n    st.rerun()\n\n",
