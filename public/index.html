      const bundledFiles = {
  "app.py": "\"\"\"\nResilientAI: Agentic AI-Based Supply Chain Decision-Support System\nApplication Router & Navigation Orchestrator\n\"\"\"\n\nimport streamlit as st\n\n# Configure global app shell\nst.set_page_config(\n    page_title=\"ResilientAI | Supply Chain Command Room\",\n    page_icon=\":material/shield:\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\"\n)\n\n# Protect subsequent set_page_config calls in individual page files so they don't error\n_orig_set_page_config = st.set_page_config\ndef _noop_set_page_config(*args, **kwargs):\n    pass\nst.set_page_config = _noop_set_page_config\n\n# Navigation definition (Removes the redundant 'app' page from the sidebar)\npages = [\n    st.Page(\"pages/1_Command_Center.py\", title=\"Command Center\", icon=\":material/dashboard:\", default=True),\n    st.Page(\"pages/2_Agent_Workspace.py\", title=\"Agent Workspace\", icon=\":material/smart_toy:\"),\n    st.Page(\"pages/3_Recovery_Planner.py\", title=\"Recovery Planner\", icon=\":material/alt_route:\"),\n    st.Page(\"pages/4_What_If_Simulator.py\", title=\"What-If Simulator\", icon=\":material/science:\"),\n    st.Page(\"pages/5_Performance_Audit.py\", title=\"Performance & Audit\", icon=\":material/fact_check:\"),\n    st.Page(\"pages/6_Supply_Chain_Data.py\", title=\"Supply Chain Data\", icon=\":material/database:\"),\n]\n\npg = st.navigation(pages)\npg.run()\n",
  "core/data_loader.py": "\"\"\"\nResilientAI - Core Data Models and Synthetic Dataset Generator\nReproducible Three-Echelon Supply Chain Network Dataset\n\"\"\"\n\nimport os\nimport pandas as pd\nfrom typing import Dict, Any, Optional\nfrom core.mock_data_generator import MockDataGenerator, generate_scenario_dataset, INDUSTRY_PRESETS\n\nDATA_DIR = os.path.join(os.path.dirname(os.path.dirname(__file__)), \"data\")\n\ndef get_default_suppliers_df() -> pd.DataFrame:\n    gen = MockDataGenerator(\"industrial_iot\", seed=42)\n    return gen.generate_suppliers_df(\n        disrupted_supplier_id=\"SUP-A\",\n        duration_days=7,\n        capacity_drop_pct=100.0\n    )\n\ndef get_default_inventory_df() -> pd.DataFrame:\n    gen = MockDataGenerator(\"industrial_iot\", seed=42)\n    return gen.generate_inventory_df(\n        daily_burn_rate=430.0,\n        initial_stock_days=2.08,\n        safety_stock_days=1.05\n    )\n\ndef get_default_demand_df() -> pd.DataFrame:\n    gen = MockDataGenerator(\"industrial_iot\", seed=42)\n    return gen.generate_demand_df(\n        horizon_days=14,\n        daily_mean_demand=430.0,\n        volatility_pct=0.06\n    )\n\ndef get_default_bom_df() -> pd.DataFrame:\n    gen = MockDataGenerator(\"industrial_iot\", seed=42)\n    return gen.generate_bom_df()\n\ndef get_default_network_nodes() -> Dict[str, Any]:\n    gen = MockDataGenerator(\"industrial_iot\", seed=42)\n    return gen.generate_network_nodes()\n\ndef initialize_data_files():\n    os.makedirs(DATA_DIR, exist_ok=True)\n    sup_path = os.path.join(DATA_DIR, \"suppliers.csv\")\n    inv_path = os.path.join(DATA_DIR, \"inventory.csv\")\n    dem_path = os.path.join(DATA_DIR, \"demand.csv\")\n    \n    if not os.path.exists(sup_path):\n        get_default_suppliers_df().to_csv(sup_path, index=False)\n    if not os.path.exists(inv_path):\n        get_default_inventory_df().to_csv(inv_path, index=False)\n    if not os.path.exists(dem_path):\n        get_default_demand_df().to_csv(dem_path, index=False)\n\nif __name__ == \"__main__\":\n    initialize_data_files()\n    print(\"Default datasets generated successfully.\")\n",
  "core/llm_service.py": "\"\"\"\nResilientAI - LLM Service & Groq Strategic Advisor Integration\nProvides high-speed LLM reasoning for the multi-agent supply chain decision-support system.\n\"\"\"\n\nimport os\nfrom typing import List, Dict, Any, Optional\nimport pandas as pd\nfrom groq import Groq\n\nDEFAULT_GROQ_API_KEY = \"\"\nGROQ_API_KEY = os.environ.get(\"GROQ_API_KEY\", \"\")\n\n# Primary & Fallback Groq Models available on this account\nPRIMARY_MODEL = \"qwen/qwen3.8-27b\"\nFALLBACK_MODEL = \"openai/gpt-oss-20b\"\n\ndef get_groq_client() -> Groq:\n    \"\"\"Initializes and returns the Groq client with the configured API key.\"\"\"\n    api_key = os.environ.get(\"GROQ_API_KEY\", \"\")\n    return Groq(api_key=api_key)\n\ndef build_system_context_prompt(session_state_dict: Dict[str, Any]) -> str:\n    \"\"\"\n    Constructs a detailed, real-time contextual prompt from active session state\n    enabling the LLM to give precise numerical answers to supply chain queries.\n    \"\"\"\n    scenario = session_state_dict.get(\"active_scenario\")\n    plan = session_state_dict.get(\"recovery_plan\")\n    suppliers_df: Optional[pd.DataFrame] = session_state_dict.get(\"suppliers_df\")\n    inventory_df: Optional[pd.DataFrame] = session_state_dict.get(\"inventory_df\")\n    demand_df: Optional[pd.DataFrame] = session_state_dict.get(\"demand_df\")\n    benchmarks = session_state_dict.get(\"benchmark_results\", {})\n    workflow = session_state_dict.get(\"workflow_execution\", {})\n    preset_name = session_state_dict.get(\"active_preset_name\", \"Industrial IoT Gateways\")\n\n    context_lines = [\n        \"You are the ResilientAI Master Strategic Advisor, an autonomous executive supply chain intelligence system.\",\n        \"Your task is to analyze disruptions, explain the optimal multi-agent recovery plan, compare options, and advise human planners.\",\n        \"CRITICAL INSTRUCTION: Do NOT use any emojis anywhere in your response. Maintain an executive, precise, quantitative tone.\",\n        \"\",\n        f\"--- ACTIVE NETWORK CONTEXT ({preset_name}) ---\"\n    ]\n\n    if scenario:\n        context_lines.append(\n            f\"- Disruption: Supplier {scenario.disrupted_supplier_id} outage lasting {scenario.duration_days} days. \"\n            f\"Capacity drop: {scenario.capacity_drop_pct}%. Demand shock: {scenario.demand_shock_pct}%.\"\n        )\n\n    if inventory_df is not None and not inventory_df.empty:\n        crit_inv = inventory_df.iloc[0]\n        context_lines.append(\n            f\"- Inventory Status ({crit_inv.get('item_name', 'Critical Component')}): On-hand: {crit_inv.get('current_stock', 0)} units, \"\n            f\"Safety stock threshold: {crit_inv.get('safety_stock', 0)} units, Daily burn rate: {crit_inv.get('daily_burn_rate', 0)} units/day, \"\n            f\"Buffer runway: {crit_inv.get('runout_days', 0)} days until line starvation.\"\n        )\n\n    if suppliers_df is not None and not suppliers_df.empty:\n        context_lines.append(\"- Registered Suppliers:\")\n        name_col = \"supplier_name\" if \"supplier_name\" in suppliers_df.columns else \"name\"\n        for _, s in suppliers_df.iterrows():\n            context_lines.append(\n                f\"  * {s.get(name_col)} (ID: {s.get('supplier_id')}): Status={s.get('status')}, \"\n                f\"Daily Capacity={s.get('daily_capacity')} u/d, Unit Cost=${s.get('unit_cost')}, \"\n                f\"Std Lead Time={s.get('std_lead_time_days')}d, Expedite Lead Time={s.get('expedite_lead_time_days')}d, \"\n                f\"Expedite Freight=${s.get('expedite_freight_cost')}/u.\"\n            )\n\n    if demand_df is not None and not demand_df.empty:\n        total_d = int(demand_df[\"demand_units\"].sum())\n        tier_col = \"customer_tier\" if \"customer_tier\" in demand_df.columns else \"tier\"\n        t1 = int(demand_df[demand_df[tier_col] == 1][\"demand_units\"].sum()) if tier_col in demand_df.columns else 0\n        context_lines.append(\n            f\"- Customer Demand: Total 14-day demand: {total_d:,} units across tiers (Tier 1 Critical: {t1:,} units).\"\n        )\n\n    if plan:\n        context_lines.append(\n            f\"- ResilientAI Optimal Recovery Plan: Fulfillment Rate={plan.fulfillment_rate}%, \"\n            f\"Total Landed Cost=${plan.total_landed_cost:,.2f}, Unmet Demand={plan.unmet_demand_units} units, \"\n            f\"Stockout Duration={plan.stockout_duration_days} days, Feasible={plan.is_feasible}.\"\n        )\n        context_lines.append(\"- Recommended Purchase Allocations:\")\n        for a in plan.allocations:\n            context_lines.append(\n                f\"  * {a.supplier_name} via {a.shipping_mode}: {a.allocated_units} units arriving Day {a.arrival_day} \"\n                f\"(Total PO Spend: ${a.total_cost:,.2f})\"\n            )\n        if plan.constraints_status:\n            context_lines.append(\"- Constraint Validations:\")\n            for c in plan.constraints_status:\n                context_lines.append(f\"  * {c.constraint_name}: {c.status} ({c.message})\")\n\n    if benchmarks and \"comparison_df\" in benchmarks:\n        comp_df = benchmarks[\"comparison_df\"]\n        context_lines.append(\"- Tri-Way Benchmark Evaluation:\")\n        for _, row in comp_df.iterrows():\n            context_lines.append(\n                f\"  * {row.get('Strategy')}: Fill Rate={row.get('Fulfillment Rate (%)')}%, \"\n                f\"Cost=${row.get('Total Landed Cost ($)'):,.0f}, Stockout={row.get('Stockout Duration (Days)')}d\"\n            )\n\n    if workflow and \"conflicts_resolved\" in workflow:\n        context_lines.append(\"- Cross-Agent Conflicts Resolved by Coordinator:\")\n        for cf in workflow[\"conflicts_resolved\"]:\n            context_lines.append(f\"  * {cf.get('conflict')}: {cf.get('resolution')}\")\n\n    context_lines.extend([\n        \"\",\n        \"INSTRUCTIONS FOR RESPONDING:\",\n        \"1. When answering the user, cite the exact numbers from the active context above.\",\n        \"2. Explain trade-offs clearly: why air expediting was used for early batches, why volume was split between backup vendors, and why Tier 1 SLAs were protected.\",\n        \"3. Provide actionable, structured bullet points or concise executive conclusions.\",\n        \"4. DO NOT use emojis.\"\n    ])\n\n    return \"\\n\".join(context_lines)\n\ndef query_chat_copilot(\n    user_query: str,\n    chat_history: List[Dict[str, str]],\n    session_state_dict: Dict[str, Any]\n) -> str:\n    \"\"\"\n    Sends the user query along with conversation history and live supply chain context\n    to the Groq LLM and returns the generated answer.\n    \"\"\"\n    system_prompt = build_system_context_prompt(session_state_dict)\n\n    # Format messages for Groq OpenAI-compatible endpoint\n    messages = [{\"role\": \"system\", \"content\": system_prompt}]\n\n    # Include recent conversation turns (up to last 6 turns to manage context window)\n    for msg in chat_history[-6:]:\n        messages.append({\"role\": msg[\"role\"], \"content\": msg[\"content\"]})\n\n    messages.append({\"role\": \"user\", \"content\": user_query})\n\n    # Attempt primary model\n    try:\n        client = get_groq_client()\n        response = client.chat.completions.create(\n            model=PRIMARY_MODEL,\n            messages=messages,\n            temperature=0.3,\n            max_tokens=800\n        )\n        content = response.choices[0].message.content\n        if content and content.strip():\n            return clean_text_emojis(content.strip())\n    except Exception as e_primary:\n        # Attempt fallback model\n        try:\n            client = get_groq_client()\n            response = client.chat.completions.create(\n                model=FALLBACK_MODEL,\n                messages=messages,\n                temperature=0.3,\n                max_tokens=800\n            )\n            content = response.choices[0].message.content\n            if content and content.strip():\n                return clean_text_emojis(content.strip())\n        except Exception as e_fallback:\n            # Deterministic intelligent fallback if API is unreachable\n            return fallback_deterministic_response(user_query, session_state_dict)\n\n    return fallback_deterministic_response(user_query, session_state_dict)\n\ndef clean_text_emojis(text: str) -> str:\n    \"\"\"Strips any emojis that might be generated by the model.\"\"\"\n    import re\n    emoji_pattern = re.compile(\n        '[\\U00010000-\\U0010ffff]|[\\u2600-\\u27bf]|[\\u2300-\\u23ff]|[\\u2b50-\\u2b55]|[\\u203c-\\u2049]|[\\u2139]|[\\u2194-\\u21aa]'\n    )\n    return emoji_pattern.sub('', text)\n\ndef fallback_deterministic_response(query: str, session_state_dict: Dict[str, Any]) -> str:\n    \"\"\"\n    High-fidelity deterministic analytical fallback in case network connectivity to Groq drops.\n    \"\"\"\n    plan = session_state_dict.get(\"recovery_plan\")\n    scenario = session_state_dict.get(\"active_scenario\")\n    bench = session_state_dict.get(\"benchmark_results\", {})\n    \n    q_lower = query.lower()\n    \n    if \"optimal\" in q_lower or \"solution\" in q_lower or \"plan\" in q_lower:\n        alloc_details = []\n        if plan:\n            for a in plan.allocations:\n                alloc_details.append(f\"- {a.supplier_name} via {a.shipping_mode}: {a.allocated_units:,} units (Arrival Day {a.arrival_day}, Total: ${a.total_cost:,.2f})\")\n            allocs_str = \"\\n\".join(alloc_details)\n            return (\n                f\"Optimal Multi-Agent Recovery Plan Synthesis:\\n\\n\"\n                f\"- Fulfillment Rate: {plan.fulfillment_rate}% (100% Tier 1 Protection Guaranteed)\\n\"\n                f\"- Total Landed Cost: ${plan.total_landed_cost:,.2f}\\n\"\n                f\"- Stockout Downtime: {plan.stockout_duration_days} Day (Transitional Buffer Bridge)\\n\"\n                f\"- Unmet Backorders: {plan.unmet_demand_units} Units (Non-critical Tier 3 deferred)\\n\\n\"\n                f\"Recommended Sourcing Split:\\n{allocs_str}\\n\\n\"\n                f\"Key Advantage: Expedited air shipments arrive on Day 3 to bridge factory starvation before inventory runs out, \"\n                f\"while standard freight batches land on Days 5-6 to restock assembly lines at minimal freight cost.\"\n            )\n            \n    if \"air\" in q_lower or \"freight\" in q_lower or \"expedite\" in q_lower:\n        return (\n            \"Logistics Rationale for Air Freight Expediting:\\n\\n\"\n            \"Plant Alpha's buffer inventory exhausts in approximately 2.1 days. Standard freight takes 5 to 6 days to arrive. \"\n            \"If only standard transit were utilized, the manufacturing plant would face an unavoidable 3-day line-down shutdown, \"\n            \"triggering Tier 1 SLA default penalties ($180-$360/unit).\\n\\n\"\n            \"By dispatching an initial bridge batch via Expedited Air arriving on Day 3, the multi-agent system eliminates factory \"\n            \"starvation while switching later replenishment to Standard Freight once the immediate danger has passed.\"\n        )\n\n    if \"supplier\" in q_lower or \"dual\" in q_lower or \"split\" in q_lower:\n        return (\n            \"Multi-Sourcing Sourcing Rationale:\\n\\n\"\n            \"Relying on a single backup vendor would exceed their maximum physical daily capacity and create secondary single-point risk. \"\n            \"The multi-agent coordinator enforces a balanced dual-sourcing split across qualified backup suppliers, satisfying total daily \"\n            \"demand burn while keeping each supplier operating comfortably within their verified daily capacity headroom.\"\n        )\n\n    return (\n        f\"ResilientAI Advisory Synthesis:\\n\\n\"\n        f\"Under the active {scenario.duration_days if scenario else 7}-day supplier outage, the autonomous multi-agent system has generated \"\n        f\"a feasible recovery plan delivering {plan.fulfillment_rate if plan else 95.5}% order fulfillment. \"\n        f\"The strategy balances expedited air shipments to prevent immediate assembly line shutdowns against standard ground freight \"\n        f\"to control total procurement spend (${plan.total_landed_cost:,.0f} landed cost vs ${bench.get('cost_savings_vs_rule_based', 250000):,.0f} savings vs legacy ERP).\"\n    )\n",
  "core/mock_data_generator.py": "\"\"\"\nResilientAI - Mock Data and Scenario Generator\nParametric, reproducible generation of supply chain networks, suppliers, inventory buffers,\ndemand schedules, and BOM relationships across multiple industry verticals.\n\"\"\"\n\nimport os\nimport numpy as np\nimport pandas as pd\nfrom typing import Dict, Any, List, Optional\n\nINDUSTRY_PRESETS = {\n    \"industrial_iot\": {\n        \"name\": \"Industrial IoT Electronics\",\n        \"finished_product\": \"Industrial IoT Gateway G-500\",\n        \"critical_component\": \"MCU-900 Control Chipset\",\n        \"critical_item_id\": \"MCU-900\",\n        \"secondary_component\": \"Enclosure Chassis CH-10\",\n        \"secondary_item_id\": \"CH-10\",\n        \"daily_burn_default\": 430,\n        \"holding_cost_default\": 0.85,\n        \"stockout_penalty_default\": 110.0,\n        \"suppliers\": [\n            {\n                \"supplier_id\": \"SUP-A\",\n                \"name\": \"Apex Microelectronics (Primary)\",\n                \"tier\": 1,\n                \"component\": \"MCU-900 Control Chipset\",\n                \"status\": \"DISRUPTED (Outage)\",\n                \"daily_capacity\": 500,\n                \"unit_cost\": 45.0,\n                \"std_lead_time_days\": 3,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 4.5,\n                \"expedite_freight_cost\": 14.0,\n                \"reliability_score\": 0.98,\n                \"risk_index\": 0.89,\n                \"is_critical\": True\n            },\n            {\n                \"supplier_id\": \"SUP-B\",\n                \"name\": \"Beacon Tech Solutions (Backup 1)\",\n                \"tier\": 1,\n                \"component\": \"MCU-900 Control Chipset\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 350,\n                \"unit_cost\": 58.0,\n                \"std_lead_time_days\": 5,\n                \"expedite_lead_time_days \": 3, \"share\": 0.25, \"penalty\": 55.0}\n        ]\n    },\n    \"automotive_ev\": {\n        \"name\": \"Automotive EV Powertrain\",\n        \"finished_product\": \"EV Motor Inverter Module INV-400\",\n        \"critical_component\": \"SiC MOSFET Power Module\",\n        \"critical_item_id\": \"SIC-800\",\n        \"secondary_component\": \"Liquid Cooling Plate CP-20\",\n        \"secondary_item_id\": \"CP-20\",\n        \"daily_burn_default\": 650,\n        \"holding_cost_default\": 1.40,\n        \"stockout_penalty_default\": 180.0,\n        \"suppliers\": [\n            {\n                \"supplier_id\": \"SUP-A\",\n                \"name\": \"HyperSemi Silicon (Primary)\",\n                \"tier\": 1,\n                \"component\": \"SiC MOSFET Power Module\",\n                \"status\": \"DISRUPTED (Outage)\",\n                \"daily_capacity\": 750,\n                \"unit_cost\": 72.0,\n                \"std_lead_time_days\": 4,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 6.5,\n                \"expedite_freight_cost\": 18.0,\n                \"reliability_score\": 0.97,\n                \"risk_index\": 0.92,\n                \"is_critical\": True\n            },\n            {\n                \"supplier_id\": \"SUP-B\",\n                \"name\": \"Vanguard Micro Electronics (Backup 1)\",\n                \"tier\": 1,\n                \"component\": \"SiC MOSFET Power Module\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 520,\n                \"unit_cost\": 92.0,\n                \"std_lead_time_days\": 5,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 8.0,\n                \"expedite_freight_cost\": 21.0,\n                \"reliability_score\": 0.94,\n                \"risk_index\": 0.16,\n                \"is_critical\": False\n            },\n            {\n                \"supplier_id\": \"SUP-C\",\n                \"nam _item_id\": \"FPGA-90\",\n        \"secondary_component\": \"Precision Titanium Housing TH-4\",\n        \"secondary_item_id\": \"TH-4\",\n        \"daily_burn_default\": 180,\n        \"holding_cost_default\": 3.80,\n        \"stockout_penalty_default\": 450.0,\n        \"suppliers\": [\n            {\n                \"supplier_id\": \"SUP-A\",\n                \"name\": \"Orbital Microchips (Primary)\",\n                \"tier\": 1,\n                \"component\": \"Rad-Hard FPGA Processing Unit\",\n                \"status\": \"DISRUPTED (Outage)\",\n                \"daily_capacity\": 220,\n                \"unit_cost\": 175.0,\n                \"std_lead_time_days\": 5,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 12.0,\n                \"expedite_freight_cost\": 32.0,\n                \"reliability_score\": 0.99,\n                \"risk_index\": 0.94,\n                \"is_critical\": True\n            },\n            {\n                \"supplier_id\": \"SUP-B\",\n                \"name\": \"AeroDynamics Silicon (Backup 1)\",\n                \"tier\": 1,\n                \"component\": \"Rad-Hard FPGA Processing Unit\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 160,\n                \"unit_cost\": 235.0,\n                \"std_lead_time_days\": 6,\n                \"expedite_lead_time_days\": 3,\n                \"std_freight_cost\": 15.0,\n                \"expedite_freight_cost\": 38.0,\n                \"reliability_score\": 0.95,\n                \"risk_index\": 0.20,\n                \"is_critical\": False\n            },\n            {\n                \"supplier_id\": \"SUP-C\",\n                \"name\": \"Apex Space Components (Backup 2)\",\n                \"tier\": 1,\n                \"component\": \"Rad-Hard FPGA Processing Unit\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 140,\n                \"unit_cost\": 255.0,\n                \"std_lead_time_days\": 4,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 14.0,\n                \"expedite_freight_cost\": 35.0,\n                \"reliability_score\": 0.96,\n                \"risk_index\": 0.15,\n                \"is_critical\": False\n            },\n            {\n                \"supplier_id\": \"SUP-D\",\n                \"name\": \"Titan Precision Aero Alloys\",\n                \"tier\": 2,\n                \"component\": \"Precision Titanium Housing TH-4\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 300,\n                \"unit_cost\": 85.0,\n                \"std_lead_time_days\": 3,\n                \"expedite_lead_time_days\": 1,\n                \"std_freight_cost\": 8.0,\n                \"expedite_freight_cost\": 18.0,\n                \"reliability_score\": 0.99,\n                \"risk_index\": 0.04,\n                \"is_critical\": False\n            }\n        ],\n        \"customers\": [\n            {\"customer_id\": \"CUST-T1\", \"name\": \"Defense Prime Contractors (Tier 1 Priority)\", \"tier\": 1, \"share\": 0.60, \"penalty\": 520.0},\n            {\"customer_id\": \"CUST-T2\", \"name\": \"National Space Agency (Tier 1 Mission Critical)\", \"tier\": 1, \"share\": 0.25, \"penalty\": 480.0},\n            {\"customer_id\": \"CUST-T3\", \"name\": \"Commercial Regional Aviation (Tier 2)\", \"tier\": 2, \"share\": 0.15, \"penalty\": 180.0}\n        ]\n    },\n    \"medical_devices\": {\n        \"name\": \"Medical Life Support Equipment\",\n        \"finished_product\": \"ICU Ventilator Controller VENT-X\",\n        \"critical_component\": \"Precision Pressure Micro-Sensor\",\n        \"critical_item_id\": \"PS-500\",\n        \"secondary_component\": \"Medical Grade Valving Unit MV-12\",\n        \"secondary_item_id\": \"MV-12\",\n        \"daily_burn_default\": 380,\n        \"holding_cost_default\": 1.15,\n        \"stockout_penalty_default\": 280.0,\n        \"suppliers\": [\n            {\n                \"supplier_id\": \"SUP-A\",\n                \"name\": \"BioSense Microelectronics (Primary)\",\n                \"tier\": 1,\n                \"component\": \"Precision Pressure Micro-Sensor\",\n                \"status\": \"DISRUPTED (Outage)\",\n                \"daily_capacity\": 420,\n                \"unit_cost\": 52.0,\n                \"std_lead_time_days\": 3,\n                \"expedite_lead_time_days\": 1,\n                \"std_freight_cost\": 5.0,\n                \"expedite_freight_cost\": 16.0,\n                \"reliability_score\": 0.99,\n                \"risk_index\": 0.91,\n                \"is_critical\": True\n            },\n            {\n                \"supplier_id\": \"SUP-B\",\n                \"name\": \"MedTech Silicon Hub (Backup 1)\",\n                \"tier\": 1,\n                \"component\": \"Precision Pressure Micro-Sensor\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 310,\n                \"unit_cost\": 69.0,\n                \"std_lead_time_days\": 4,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 6.8,\n                \"expedite_freight_cost\": 18.5,\n                \"reliability_score\": 0.96,\n                \"risk_index\": 0.15,\n                \"is_critical\": False\n            },\n            {\n                \"supplier_id\": \"SUP-C\",\n                \"name\": \"Precision BioComponents (Backup 2)\",\n                \"tier\": 1,\n                \"component\": \"Precision Pressure Micro-Sensor\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 270,\n                \"unit_cost\": 75.0,\n                \"std_lead_time_days\": 4,\n                \"expedite_lead_time_days\": 2,\n                \"std_freight_cost\": 6.2,\n                \"expedite_freight_cost\": 17.0,\n                \"reliability_score\": 0.97,\n                \"risk_index\": 0.11,\n                \"is_critical\": False\n            },\n            {\n                \"supplier_id\": \"SUP-D\",\n                \"name\": \"Swiss Medical Precision Valving\",\n                \"tier\": 2,\n                \"component\": \"Medical Grade Valving Unit MV-12\",\n                \"status\": \"OPERATIONAL\",\n                \"daily_capacity\": 500,\n                \"unit_cost\": 36.0,\n                \"std_lead_time_days\": 3,\n                \"expedite_lead_time_days\": 1,\n                \"std_freight_cost\": 4.0,\n                \"expedite_freight_cost\": 10.0,\n                \"reliability_score\": 0.99,\n                \"risk_index\": 0.05,\n                \"is_critical\": False\n            }\n        ],\n        \"customers\": [\n            {\"customer_id\": \"CUST-T1\", \"name\": \"Acute Care Hospital Networks (Tier 1 Priority)\", \"tier\": 1, \"share\": 0.55, \"penalty\": 360.0},\n            {\"customer_id\": \"CUST-T2\", \"name\": \"Emergency Preparedness Reserves (Tier 1 Priority)\", \"tier\": 1, \"share\": 0.30, \"penalty\": 310.0},\n            {\"customer_id\": \"CUST-T3\", \"name\": \"Regional Private Clinics (Tier 2)\", \"tier\": 2, \"share\": 0.15, \"penalty\": 110.0}\n        ]\n    }\n}\n\n\nclass MockDataGenerator:\n    \"\"\"\n    Parametric Mock Data Generator for Supply Chain Simulation.\n    Creates dynamic datasets according to user parameters, disruption scenarios,\n    and industry configurations.\n    \"\"\"\n\n    def __init__(self, preset_key: str = \"industrial_iot\", seed: Optional[int] = 42):\n        self.preset_key = preset_key if preset_key in INDUSTRY_PRESETS else \"industrial_iot\"\n        self.preset = INDUSTRY_PRESETS[self.preset_key]\n        self.seed = seed\n        if self.seed is not None:\n            np.random.seed(self.seed)\n\n    def generate_suppliers_df(\n        self,\n        disrupted_supplier_id: str = \"SUP-A\",\n        duration_days: int = 7,\n        capacity_drop_pct: float = 100.0,\n        supplier_b_capacity_override: Optional[int] = None,\n        supplier_c_capacity_override: Optional[int] = None,\n        cost_multiplier: float = 1.0\n    ) -> pd.DataFrame:\n        \"\"\"Generates suppliers dataframe reflecting active scenario parameters.\"\"\"\n        raw_list = [dict(s) for s in self.preset[\"suppliers\"]]\n        \n        for sup in raw_list:\n            sup[\"supplier_name\"] = sup[\"name\"]\n            sup[\"critical_component\"] = sup[\"component\"]\n            # Scale costs\n            sup[\"unit_cost\"] = round(sup[\"unit_cost\"] * cost_multiplier, 2)\n            sup[\"std_freight_cost\"] = round(sup[\"std_freight_cost\"] * cost_multiplier, 2)\n            sup[\"expedite_freight_cost\"] = round(sup[\"expedite_freight_cost\"] * cost_multiplier, 2)\n            \n            # Apply disruption\n            if sup[\"supplier_id\"] == disrupted_supplier_id:\n                if capacity_drop_pct >= 99.0:\n                    sup[\"status\"] = f\"DISRUPTED ({duration_days}-Day Shutdown)\"\n                    sup[\"risk_index\"] = 0.95\n                else:\n                    sup[\"status\"] = f\"RESTRICTED (-{int(capacity_drop_pct)}% Capacity)\"\n                    sup[\"risk_index\"] = round(0.5 + (capacity_drop_pct / 200.0), 2)\n                sup[\"is_critical\"] = True\n            else:\n                sup[\"status\"] = \"OPERATIONAL\"\n                if sup[\"supplier_id\"] == \"SUP-B\" and supplier_b_capacity_override is not None:\n                    sup[\"daily_capacity\"] = supplier_b_capacity_override\n                elif sup[\"supplier_id\"] == \"SUP-C\" and supplier_c_capacity_override is not None:\n                    sup[\"daily_capacity\"] = supplier_c_capacity_override\n\n        return pd.DataFrame(raw_list)\n\n    def generate_inventory_df(\n        self,\n        daily_burn_rate: Optional[float] = None,\n        initial_stock_days: float = 2.08,\n        safety_stock_days: float = 1.05,\n        holding_cost_override: Optional[float] = None,\n        penalty_override: Optional[float] = None\n    ) -> pd.DataFrame:\n        \"\"\"Generates inventory buffers dynamically mapped to burn rates and runway targets.\"\"\"\n        burn = daily_burn_rate if daily_burn_rate is not None else float(self.preset[\"daily_burn_default\"])\n        crit_item_id = self.preset[\"critical_item_id\"]\n        crit_item_name = self.preset[\"critical_component\"]\n        sec_item_id = self.preset[\"secondary_item_id\"]\n        sec_item_name = self.preset[\"secondary_component\"]\n        \n        current_stock = int(round(burn * initial_stock_days))\n        safety_stock = int(round(burn * safety_stock_days))\n        runout_days = round(current_stock / burn, 2)\n        \n        h_cost = holding_cost_override or self.preset[\"holding_cost_default\"]\n        p_cost = penalty_override or self.preset[\"stockout_penalty_default\"]\n\n        data = [\n            {\n                \"item_id\": crit_item_id,\n                \"item_name\": crit_item_name,\n                \"location\": \"Plant Alpha (Central)\",\n                \"current_stock\": current_stock,\n                \"safety_stock\": safety_stock,\n                \"daily_burn_rate\": int(burn),\n                \"runout_days\": runout_days,\n                \"holding_cost_per_day\": round(h_cost, 2),\n                \"stockout_penalty_per_unit\": round(p_cost, 2),\n                \"unit\": \"Units\"\n            },\n            {\n                \"item_id\": sec_item_id,\n                \"item_name\": sec_item_name,\n                \"location\": \"Plant Alpha (Central)\",\n                \"current_stock\": int(burn * 5.5),\n                \"safety_stock\": int(burn * 1.8),\n                \"daily_burn_rate\": int(burn),\n                \"runout_days\": 5.5,\n                \"holding_cost_per_day\": round(h_cost * 0.4, 2),\n                \"stockout_penalty_per_unit\": round(p_cost * 0.4, 2),\n                \"unit\": \"Units\"\n            },\n            {\n                \"item_id\": \"FG-MOD\",\n                \"item_name\": f\"Finished {self.preset['finished_product']}\",\n                \"location\": \"DC East / DC West\",\n                \"current_stock\": int(burn * 0.8),\n                \"safety_stock\": int(burn * 1.2),\n                \"daily_burn_rate\": int(burn * 0.95),\n                \"runout_days\": 0.8,\n                \"holding_cost_per_day\": round(h_cost * 1.7, 2),\n                \"stockout_penalty_per_unit\": round(p_cost * 1.3, 2),\n                \"unit\": \"Units\"\n            }\n        ]\n        return pd.DataFrame(data)\n\n    def generate_demand_df(\n        self,\n        horizon_days: int = 14,\n        daily_mean_demand: Optional[float] = None,\n        volatility_pct: float = 0.06,\n        demand_shock_pct: float = 0.0\n    ) -> pd.DataFrame:\n        \"\"\"Generates dynamic customer demand across planning horizon.\"\"\"\n        if self.seed is not None:\n            np.random.seed(self.seed)\n            \n        base_mean = daily_mean_demand or float(self.preset[\"daily_burn_default\"])\n        # Apply demand shock\n        mean_demand = base_mean * (1.0 + demand_shock_pct / 100.0)\n        std_dev = mean_demand * volatility_pct\n        \n        customers = self.preset[\"customers\"]\n        records = []\n        \n        for day in range(1, horizon_days + 1):\n            daily_total = max(10, int(round(np.random.normal(mean_demand, std_dev))))\n            for cust in customers:\n                qty = max(1, int(round(daily_total * cust[\"share\"])))\n                records.append({\n                    \"day\": day,\n                    \"customer_id\": cust[\"customer_id\"],\n                    \"customer_name\": cust[\"name\"],\n                    \"tier\": cust[\"tier\"],\n                    \"customer_tier\": cust[\"tier\"],\n                    \"demand_units\": qty,\n                    \"sla_penalty_per_unit\": cust[\"penalty\"]\n                })\n                \n        return pd.DataFrame(records)\n\n    def generate_bom_df(self) -> pd.DataFrame:\n        \"\"\"Generates structural Bill of Materials for assembly operations.\"\"\"\n        bom = [\n            {\n                \"Finished Product\": self.preset[\"finished_product\"],\n                \"Component ID\": self.preset[\"critical_item_id\"],\n                \"Component Name\": self.preset[\"critical_component\"],\n                \"Qty Required\": 1,\n                \"Primary Supplier\": f\"{self.preset['suppliers'][0]['name']} ({self.preset['suppliers'][0]['supplier_id']})\",\n                \"Criticality\": \"CRITICAL (Bottleneck Component)\"\n            },\n            {\n                \"Finished Product\": self.preset[\"finished_product\"],\n                \"Component ID\": self.preset[\"secondary_item_id\"],\n                \"Component Name\": self.preset[\"secondary_component\"],\n                \"Qty Required\": 1,\n                \"Primary Supplier\": f\"{self.preset['suppliers'][3]['name']} ({self.preset['suppliers'][3]['supplier_id']})\",\n                \"Criticality\": \"STANDARD (Redundant Available)\"\n            }\n        ]\n        return pd.DataFrame(bom)\n\n    def generate_network_nodes(self, suppliers_df: Optional[pd.DataFrame] = None) -> Dict[str, Any]:\n        \"\"\"Generates network graph node definitions.\"\"\"\n        s_df = suppliers_df if suppliers_df is not None else self.generate_suppliers_df()\n        \n        sup_nodes = []\n        for _, row in s_df.iterrows():\n            if row[\"tier\"] == 1:\n                is_disrupted = \"DISRUPTED\" in str(row[\"status\"]).upper()\n                sup_nodes.append({\n                    \"id\": row[\"supplier_id\"],\n                    \"label\": row[\"name\"],\n                    \"type\": \"supplier\",\n                    \"echelon\": 1,\n                    \"status\": \"down\" if is_disrupted else \"active\"\n                })\n                \n        return {\n            \"suppliers\": sup_nodes,\n            \"plants\": [\n                {\"id\": \"PLANT-ALPHA\", \"label\": \"Assembly Plant Alpha\", \"type\": \"plant\", \"echelon\": 2, \"status\": \"active\", \"capacity\": int(self.preset[\"daily_burn_default\"] * 1.05)}\n            ],\n            \"dcs\": [\n                {\"id\": \"DC-EAST\", \"label\": \"Regional Hub East\", \"type\": \"dc\", \"echelon\": 3, \"status\": \"active\"},\n                {\"id\": \"DC-WEST\", \"label\": \"Regional Hub West\", \"type\": \"dc\", \"echelon\": 3, \"status\": \"active\"}\n            ]\n        }\n\n\ndef generate_scenario_dataset(\n    preset_key: str = \"industrial_iot\",\n    preset: Optional[str] = None,\n    disrupted_supplier_id: str = \"SUP-A\",\n    duration_days: int = 7,\n    capacity_drop_pct: float = 100.0,\n    demand_shock_pct: float = 0.0,\n    daily_burn_rate: Optional[float] = None,\n    initial_stock_days: float = 2.08,\n    safety_stock_days: float = 1.05,\n    inventory_buffer_days: Optional[float] = None,\n    disruption_severity: str = \"critical\",\n    demand_volatility: str = \"stable\",\n    num_suppliers: int = 4,\n    supplier_b_capacity_override: Optional[int] = None,\n    supplier_c_capacity_override: Optional[int] = None,\n    seed: Optional[int] = 42\n) -> Dict[str, Any]:\n    \"\"\"\n    Convenience orchestrator generating a complete coherent bundle of\n    suppliers, inventory, demand, BOM, and network metadata.\n    \"\"\"\n    actual_preset = preset or preset_key\n    gen = MockDataGenerator(preset_key=actual_preset, seed=seed)\n    \n    # Handle disruption severity mapping\n    severity_map = {\n        \"low\": 40.0,\n        \"medium\": 70.0,\n        \"high\": 90.0,\n        \"critical\": 100.0\n    }\n    actual_drop = severity_map.get(disruption_severity.lower(), capacity_drop_pct)\n\n    # Handle buffer days\n    actual_init_days = inventory_buffer_days if inventory_buffer_days is not None else initial_stock_days\n\n    # Handle volatility mapping\n    vol_map = {\n        \"stable\": 0.05,\n        \"moderate\": 0.12,\n        \"high\": 0.25\n    }\n    actual_vol = vol_map.get(demand_volatility.lower(), 0.06)\n\n    sup_df = gen.generate_suppliers_df(\n        disrupted_supplier_id=disrupted_supplier_id,\n        duration_days=duration_days,\n        capacity_drop_pct=actual_drop,\n        supplier_b_capacity_override=supplier_b_capacity_override,\n        supplier_c_capacity_override=supplier_c_capacity_override\n    )\n    \n    inv_df = gen.generate_inventory_df(\n        daily_burn_rate=daily_burn_rate,\n        initial_stock_days=actual_init_days,\n        safety_stock_days=safety_stock_days\n    )\n    \n    dem_df = gen.generate_demand_df(\n        horizon_days=14,\n        daily_mean_demand=daily_burn_rate,\n        demand_shock_pct=demand_shock_pct,\n        volatility_pct=actual_vol\n    )\n    \n    bom_df = gen.generate_bom_df()\n    network_nodes = gen.generate_network_nodes(sup_df)\n    \n    return {\n        \"suppliers_df\": sup_df,\n        \"inventory_df\": inv_df,\n        \"demand_df\": dem_df,\n        \"bom_df\": bom_df,\n        \"network_nodes\": network_nodes,\n        \"preset_name\": gen.preset[\"name\"],\n        \"critical_item_id\": gen.preset[\"critical_item_id\"],\n        \"critical_component\": gen.preset[\"critical_component\"],\n        \"disrupted_supplier_id\": disrupted_supplier_id\n    }\n",
  "core/models.py": "\"\"\"\nResilientAI - Data Models and Schema Definitions\n\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import List, Dict, Any, Optional\n\n@dataclass\nclass DisruptionScenario:\n    disrupted_supplier_id: str = \"SUP-A\"\n    duration_days: int = 7\n    capacity_drop_pct: float = 100.0  # 100% shutdown\n    demand_shock_pct: float = 0.0     # +/- % shift in customer demand\n    supplier_b_capacity_override: Optional[int] = None\n    supplier_c_capacity_override: Optional[int] = None\n    supplier_capacity_overrides: Dict[str, int] = field(default_factory=dict)\n    expedite_available: bool = True\n\n@dataclass\nclass AgentProposal:\n    agent_name: str\n    action_type: str  # e.g., \"SENSE_DEMAND\", \"EXPEDITE_PO\", \"SPLIT_ALLOCATION\", \"TIER_RATIONING\"\n    parameters: Dict[str, Any]\n    confidence_score: float\n    rationale: str\n    estimated_cost: float\n    trade_off_notes: str\n\n@dataclass\nclass SupplierAllocation:\n    supplier_id: str\n    supplier_name: str\n    allocated_units: int\n    shipping_mode: str  # \"EXPEDITED_AIR\" or \"STANDARD_FREIGHT\"\n    lead_time_days: int\n    arrival_day: int\n    unit_cost: float\n    freight_cost_per_unit: float\n    total_cost: float\n\n@dataclass\nclass ConstraintCheckResult:\n    constraint_name: str\n    status: str  # \"PASSED\", \"WARNING\", \"VIOLATED\"\n    message: str\n    metric_value: Any\n    threshold: Any\n\n@dataclass\nclass RecoveryPlanResult:\n    scenario: DisruptionScenario\n    allocations: List[SupplierAllocation]\n    total_material_cost: float\n    total_freight_cost: float\n    total_holding_cost: float\n    total_backorder_penalty: float\n    total_landed_cost: float\n    fulfillment_rate: float\n    unmet_demand_units: int\n    recovery_time_days: int\n    stockout_duration_days: int\n    constraints_status: List[ConstraintCheckResult]\n    is_feasible: bool\n    confidence_score: float\n    executive_summary: str\n    trade_off_analysis: Dict[str, Any]\n    agent_proposals: List[AgentProposal] = field(default_factory=list)\n\n@dataclass\nclass AuditRecord:\n    timestamp: str\n    action: str  # \"PLAN_APPROVED\", \"PLAN_REJECTED\", \"WHAT_IF_TESTED\", \"OVERRIDE\"\n    planner_id: str\n    scenario_summary: str\n    plan_cost: float\n    fill_rate: float\n    notes: str\n",
  "core/state.py": "\"\"\"\nResilientAI - Session State and Context Management\nEnsures all 6 application pages share unified scenario data, simulation runs, and audit trail.\n\"\"\"\n\nimport streamlit as st\nimport pandas as pd\nfrom datetime import datetime\nfrom typing import Dict, Any, List, Optional\nfrom core.data_loader import (\n    get_default_suppliers_df, get_default_inventory_df, get_default_demand_df,\n    get_default_bom_df, initialize_data_files\n)\nfrom core.models import DisruptionScenario, RecoveryPlanResult, AuditRecord\nfrom core.agents.coordinator_agent import CoordinatorAgent\nfrom core.optimization.solver import SupplyChainOptimizer\n\ndef init_session_state():\n    \"\"\"Initializes global session state across all pages.\"\"\"\n    initialize_data_files()\n    \n    if \"suppliers_df\" not in st.session_state:\n        st.session_state.suppliers_df = get_default_suppliers_df()\n        \n    if \"inventory_df\" not in st.session_state:\n        st.session_state.inventory_df = get_default_inventory_df()\n        \n    if \"demand_df\" not in st.session_state:\n        st.session_state.demand_df = get_default_demand_df()\n\n    if \"bom_df\" not in st.session_state:\n        st.session_state.bom_df = get_default_bom_df()\n        \n    if \"active_scenario\" not in st.session_state:\n        st.session_state.active_scenario = DisruptionScenario(\n            disrupted_supplier_id=\"SUP-A\",\n            duration_days=7,\n            capacity_drop_pct=100.0,\n            demand_shock_pct=0.0\n        )\n        \n    if \"audit_history\" not in st.session_state:\n        st.session_state.audit_history = [\n            AuditRecord(\n                timestamp=datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n                action=\"SYSTEM_INIT\",\n                planner_id=\"SYSTEM\",\n                scenario_summary=\"Initial 7-day Supplier A disruption scenario loaded.\",\n                plan_cost=0.0,\n                fill_rate=100.0,\n                notes=\"Network baseline initialized.\"\n            )\n        ]\n        \n    if \"plan_approval_status\" not in st.session_state:\n        st.session_state.plan_approval_status = \"PENDING_REVIEW\"  # \"APPROVED\", \"REJECTED\", \"PENDING_REVIEW\"\n        \n    if \"workflow_execution\" not in st.session_state or st.session_state.get(\"force_recompute\", False):\n        run_multi_agent_workflow()\n        st.session_state.force_recompute = False\n\ndef run_multi_agent_workflow():\n    \"\"\"Runs the full multi-agent collaborative workflow and updates session state.\"\"\"\n    coordinator = CoordinatorAgent(\n        st.session_state.suppliers_df,\n        st.session_state.inventory_df,\n        st.session_state.demand_df\n    )\n    result = coordinator.execute_workflow(st.session_state.active_scenario)\n    st.session_state.workflow_execution = result\n    st.session_state.recovery_plan = result[\"recovery_plan\"]\n    \n    # Also run benchmark\n    optimizer = SupplyChainOptimizer(\n        st.session_state.suppliers_df,\n        st.session_state.inventory_df,\n        st.session_state.demand_df\n    )\n    st.session_state.benchmark_results = optimizer.run_benchmark_comparison(st.session_state.active_scenario)\n\ndef apply_mock_dataset(dataset_bundle: Dict[str, Any], scenario: Optional[DisruptionScenario] = None, notes: str = \"\"):\n    \"\"\"Applies a newly generated mock dataset to global session state and triggers workflow.\"\"\"\n    if \"suppliers_df\" in dataset_bundle:\n        st.session_state.suppliers_df = dataset_bundle[\"suppliers_df\"]\n    if \"inventory_df\" in dataset_bundle:\n        st.session_state.inventory_df = dataset_bundle[\"inventory_df\"]\n    if \"demand_df\" in dataset_bundle:\n        st.session_state.demand_df = dataset_bundle[\"demand_df\"]\n    if \"bom_df\" in dataset_bundle:\n        st.session_state.bom_df = dataset_bundle[\"bom_df\"]\n    if \"preset_name\" in dataset_bundle:\n        st.session_state.active_preset_name = dataset_bundle[\"preset_name\"]\n\n    if scenario is not None:\n        st.session_state.active_scenario = scenario\n\n    run_multi_agent_workflow()\n    \n    record_audit(\n        action=\"DATASET_GENERATED\",\n        planner_id=\"OPERATOR\",\n        notes=notes or f\"Generated mock dataset for {dataset_bundle.get('preset_name', 'Custom Scenario')}.\"\n    )\n\ndef record_audit(action: str, planner_id: str, notes: str):\n    \"\"\"Records an action in the immutable audit log.\"\"\"\n    plan: RecoveryPlanResult = st.session_state.recovery_plan\n    record = AuditRecord(\n        timestamp=datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n        action=action,\n        planner_id=planner_id,\n        scenario_summary=f\"Supplier {st.session_state.active_scenario.disrupted_supplier_id} ({st.session_state.active_scenario.duration_days}d shutdown)\",\n        plan_cost=plan.total_landed_cost,\n        fill_rate=plan.fulfillment_rate,\n        notes=notes\n    )\n    st.session_state.audit_history.insert(0, record)\n",
  "core/ui_components.py": "\"\"\"\nResilientAI - Enterprise UI Components and Plotly Visualizers\nIndustrial SaaS design tokens and restrained, high-density operations visualizers.\nSymmetric, responsive, and color-matched to the Control Tower reference design.\n\"\"\"\n\nimport streamlit as st\nimport plotly.graph_objects as go\nimport plotly.express as px\nimport pandas as pd\nimport numpy as np\nfrom typing import Dict, Any, List\n\ndef apply_custom_css():\n    \"\"\"Injects professional enterprise-grade SaaS styling with full laptop & mobile responsiveness.\"\"\"\n    st.markdown(\"\"\"\n    <style>\n    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');\n    \n    html, body, [class*=\"css\"], .stApp {\n        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;\n        background-color: #050505 !important;\n        color: #E2E8F0 !important;\n    }\n    \n    code, pre, .mono {\n        font-family: 'JetBrains Mono', monospace !important;\n    }\n\n    /* Streamlit Header Styling - Transparent & Sleek */\n    header[data-testid=\"stHeader\"] {\n        background: transparent !important;\n        height: 2.25rem !important;\n        z-index: 50 !important;\n    }\n    [data-testid=\"stAppDeployButton\"], .stDeployButton {\n        display: none !important;\n    }\n\n    /* Container padding - Symmetrical & Clean */\n    .block-container,\n    [data-testid=\"stMainBlockContainer\"],\n    .stMainBlockContainer {\n        padding-top: 2.5rem !important;\n        padding-bottom: 2rem !important;\n        padding-left: 1.25rem !important;\n        padding-right: 1.25rem !important;\n        max-width: 100% !important;\n    }\n\n    /* Narrow Left Navigation Rail (Sidebar) Styling matching C3 AI Reference */\n    [data-testid=\"stSidebar\"] {\n        background-color: #07090E !important;\n        border-right: 1px solid #161D2A !important;\n    }\n    [data-testid=\"stSidebar\"] [data-testid=\"stSidebarNav\"] {\n        padding-top: 0.5rem !important;\n    }\n    [data-testid=\"stSidebar\"] [data-testid=\"stSidebarNavItems\"] li a {\n        background: transparent !important;\n        border-radius: 6px !important;\n        color: #94A3B8 !important;\n        font-size: 0.8rem !important;\n        font-weight: 500 !important;\n        transition: all 0.15s ease !important;\n        margin-bottom: 3px !important;\n        padding: 8px 12px !important;\n        border-left: 3px solid transparent !important;\n    }\n    [data-testid=\"stSidebar\"] [data-testid=\"stSidebarNavItems\"] li a:hover {\n        background: rgba(168, 85, 247, 0.08) !important;\n        color: #F8FAFC !important;\n    }\n    [data-testid=\"stSidebar\"] [data-testid=\"stSidebarNavItems\"] li a[aria-current=\"page\"] {\n        background: rgba(168, 85, 247, 0.15) !important;\n        color: #FFFFFF !important;\n        border-left: 3px solid #A855F7 !important;\n        font-weight: 700 !important;\n        box-shadow: 0 0 14px rgba(168, 85, 247, 0.22) !important;\n    }\n\n    /* Responsive Column Handling */\n    @media (max-width: 1024px) {\n        [data-testid=\"column\"] {\n            width: 100% !important;\n            flex: 1 1 100% !important;\n            min-width: 100% !important;\n            margin-bottom: 1.25rem !important;\n        }\n    }\n\n    /* Control Tower Top Navigation Header (Matching Reference Image) */\n    .ct-top-header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        background: #0B0E15;\n        border: 1px solid #1A2333;\n        border-radius: 8px;\n        padding: 6px 14px;\n        margin-bottom: 12px;\n        flex-wrap: wrap;\n        gap: 10px;\n    }\n    .ct-header-left {\n        display: flex;\n        align-items: center;\n        gap: 10px;\n    }\n    .ct-header-logo {\n        background: #A855F7;\n        color: #FFFFFF;\n        font-weight: 800;\n        font-size: 0.72rem;\n        padding: 3px 7px;\n        border-radius: 4px;\n        letter-spacing: 0.04em;\n    }\n    .ct-header-title {\n        font-size: 1.12rem;\n        font-weight: 700;\n        color: #F8FAFC;\n        letter-spacing: -0.01em;\n    }\n    .ct-header-center {\n        display: flex;\n        align-items: center;\n        gap: 16px;\n    }\n    .ct-header-tab {\n        display: flex;\n        flex-direction: column;\n        cursor: pointer;\n        padding: 2px 8px;\n        border-radius: 4px;\n        transition: background 0.15s ease;\n    }\n    .ct-header-tab:hover {\n        background: rgba(255, 255, 255, 0.04);\n    }\n    .ct-tab-name {\n        font-size: 0.76rem;\n        font-weight: 700;\n        color: #F1F5F9;\n    }\n    .ct-tab-sub {\n        font-size: 0.65rem;\n        color: #64748B;\n        display: flex;\n        align-items: center;\n        gap: 4px;\n    }\n    .ct-header-right {\n        display: flex;\n        align-items: center;\n        gap: 12px;\n    }\n    .ct-util-icon {\n        font-size: 13px;\n        cursor: pointer;\n        color: #94A3B8;\n        transition: color 0.15s ease;\n    }\n    .ct-util-icon:hover {\n        color: #F8FAFC;\n    }\n    .ct-bell-badge {\n        position: relative;\n        cursor: pointer;\n    }\n    .ct-badge-dot {\n        position: absolute;\n        top: -4px;\n        right: -6px;\n        background: #EF4444;\n        color: #FFFFFF;\n        font-size: 8px;\n        font-weight: 800;\n        border-radius: 50%;\n        padding: 0 3px;\n        line-height: 12px;\n    }\n    .ct-user-avatar {\n        width: 24px;\n        height: 24px;\n        border-radius: 50%;\n        background: linear-gradient(135deg, #A855F7 0%, #3B82F6 100%);\n        color: #07090E;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-size: 10px;\n        font-weight: 800;\n    }\n\n    /* Quick Action 4-Halo Clusters (Matching Reference Image) */\n    .qa-halo-container {\n        display: flex;\n        justify-content: space-between;\n        margin-bottom: 12px;\n        gap: 6px;\n    }\n    .qa-halo-item {\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        gap: 4px;\n        flex: 1;\n        cursor: pointer;\n        transition: transform 0.15s ease;\n    }\n    .qa-halo-item:hover {\n        transform: translateY(-2px);\n    }\n    .qa-halo-circle {\n        width: 36px;\n        height: 36px;\n        border-radius: 50%;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-size: 13px;\n        font-weight: 700;\n        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);\n    }\n    .qa-halo-circle.red {\n        background: rgba(239, 68, 68, 0.16);\n        border: 1.5px solid #EF4444;\n        color: #EF4444;\n        box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);\n    }\n    .qa-halo-circle.blue {\n        background: rgba(59, 130, 246, 0.16);\n        border: 1.5px solid #3B82F6;\n        color: #3B82F6;\n        box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);\n    }\n    .qa-halo-circle.green {\n        background: rgba(16, 185, 129, 0.16);\n        border: 1.5px solid #10B981;\n        color: #10B981;\n        box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);\n    }\n    .qa-halo-circle.purple {\n        background: rgba(168, 85, 247, 0.16);\n        border: 1.5px solid #A855F7;\n        color: #A855F7;\n        box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);\n    }\n    .qa-halo-label {\n        font-size: 0.64rem;\n        color: #94A3B8;\n        font-weight: 600;\n        text-align: center;\n    }\n\n    /* Reference Card: \"Summary | List of Missions\" Toggle Pill */\n    .ct-toggle-bar {\n        display: flex;\n        background: #0A0D14;\n        border: 1px solid #1A2333;\n        border-radius: 6px;\n        padding: 2px;\n        margin-bottom: 10px;\n    }\n    .ct-toggle-opt {\n        flex: 1;\n        text-align: center;\n        padding: 5px 8px;\n        font-size: 0.68rem;\n        font-weight: 600;\n        border-radius: 4px;\n        cursor: pointer;\n        color: #94A3B8;\n        transition: all 0.15s ease;\n    }\n    .ct-toggle-opt.active {\n        background: #18202E;\n        color: #F8FAFC;\n        box-shadow: 0 1px 4px rgba(0,0,0,0.3);\n    }\n\n    /* Mission Feed Card with Donut Ring */\n    .ct-mission-card {\n        background: #10141D;\n        border: 1px solid #1A2333;\n        border-radius: 8px;\n        padding: 9px 12px;\n        margin-bottom: 8px;\n        transition: border-color 0.15s ease, background 0.15s ease;\n    }\n    .ct-mission-card:hover {\n        border-color: #2D3B52;\n        background: #131824;\n    }\n    .ct-mission-header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 6px;\n    }\n    .ct-mission-id {\n        display: flex;\n        align-items: center;\n        gap: 6px;\n        font-size: 0.74rem;\n        font-weight: 700;\n        color: #F8FAFC;\n    }\n    .ct-mission-route {\n        display: flex;\n        align-items: center;\n        justify-content: space-between;\n        font-size: 0.70rem;\n        color: #94A3B8;\n        margin-bottom: 8px;\n    }\n    .ct-mission-bottom {\n        display: flex;\n        align-items: center;\n        gap: 10px;\n    }\n    .ct-progress-text {\n        font-size: 0.66rem;\n        color: #94A3B8;\n    }\n\n    /* Status Chips */\n    .ops-status-chip {\n        display: inline-flex;\n        align-items: center;\n        gap: 5px;\n        padding: 3px 9px;\n        border-radius: 4px;\n        font-size: 0.72rem;\n        font-weight: 600;\n        white-space: nowrap;\n    }\n    .chip-green {\n        background: rgba(16, 185, 129, 0.12);\n        color: #10B981;\n        border: 1px solid rgba(16, 185, 129, 0.3);\n    }\n    .chip-amber {\n        background: rgba(245, 158, 11, 0.12);\n        color: #F59E0B;\n        border: 1px solid rgba(245, 158, 11, 0.3);\n    }\n    .chip-red {\n        background: rgba(239, 68, 68, 0.12);\n        color: #EF4444;\n        border: 1px solid rgba(239, 68, 68, 0.3);\n    }\n    .chip-cyan {\n        background: rgba(6, 182, 212, 0.12);\n        color: #06B6D4;\n        border: 1px solid rgba(6, 182, 212, 0.3);\n    }\n    .chip-purple {\n        background: rgba(168, 85, 247, 0.12);\n        color: #A855F7;\n        border: 1px solid rgba(168, 85, 247, 0.3);\n    }\n\n    /* Enterprise Panel Card */\n    .ops-panel {\n        background: #0E121A;\n        border: 1px solid #1C2433;\n        border-radius: 8px;\n        padding: 12px 14px;\n        margin-bottom: 12px;\n    }\n    .ops-panel-header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 10px;\n        padding-bottom: 6px;\n        border-bottom: 1px solid #18202D;\n    }\n    .ops-panel-title {\n        font-size: 0.8rem;\n        font-weight: 700;\n        color: #F1F5F9;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n    }\n    .ops-panel-badge {\n        font-size: 0.7rem;\n        color: #94A3B8;\n        font-weight: 500;\n    }\n\n    /* Symmetrical Full-Width KPI Row (No awkward cutoffs) */\n    .ops-kpi-row {\n        background: #10141D;\n        border: 1px solid #1A2333;\n        border-radius: 6px;\n        padding: 8px 12px;\n        margin-bottom: 7px;\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        transition: border-color 0.15s ease;\n    }\n    .ops-kpi-row:hover {\n        border-color: #2D3B52;\n    }\n    .ops-kpi-left {\n        display: flex;\n        flex-direction: column;\n        gap: 2px;\n    }\n    .ops-kpi-label {\n        font-size: 0.68rem;\n        color: #94A3B8;\n        font-weight: 600;\n        text-transform: uppercase;\n        letter-spacing: 0.04em;\n    }\n    .ops-kpi-sub {\n        font-size: 0.70rem;\n        color: #64748B;\n        font-weight: 500;\n    }\n    .ops-kpi-right {\n        display: flex;\n        flex-direction: column;\n        align-items: flex-end;\n        gap: 2px;\n    }\n    .ops-kpi-val {\n        font-size: 1.15rem;\n        font-weight: 800;\n        color: #F8FAFC;\n        line-height: 1.1;\n    }\n\n    /* Symmetrical Key-Value Metadata Grid */\n    .ops-kv-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr;\n        gap: 8px 10px;\n        background: #10141D;\n        border: 1px solid #1A2333;\n        border-radius: 6px;\n        padding: 10px 12px;\n        margin-bottom: 12px;\n    }\n    .ops-kv-cell {\n        display: flex;\n        flex-direction: column;\n        gap: 2px;\n    }\n    .ops-kv-label {\n        font-size: 0.64rem;\n        color: #64748B;\n        text-transform: uppercase;\n        font-weight: 700;\n        letter-spacing: 0.04em;\n    }\n    .ops-kv-val {\n        font-size: 0.78rem;\n        font-weight: 600;\n        color: #F8FAFC;\n        word-break: break-word;\n    }\n\n    /* Donut Legend List */\n    .donut-legend-grid {\n        display: grid;\n        grid-template-columns: 1fr 1fr;\n        gap: 6px 8px;\n        margin-top: 6px;\n        font-size: 0.70rem;\n        color: #94A3B8;\n    }\n    .donut-legend-item {\n        display: flex;\n        align-items: center;\n        gap: 6px;\n    }\n\n    /* Enterprise Button Styling */\n    div[data-testid=\"stButton\"] > button {\n        background-color: #10141D !important;\n        color: #E2E8F0 !important;\n        border: 1px solid #1E2738 !important;\n        border-radius: 6px !important;\n        font-family: 'Inter', sans-serif !important;\n        font-size: 0.74rem !important;\n        font-weight: 600 !important;\n        padding: 6px 12px !important;\n        transition: all 0.15s ease !important;\n    }\n    div[data-te istribution centers.\n    \"\"\"\n    allocs_by_sup = {}\n    air_by_sup = {}\n    std_by_sup = {}\n    if plan and hasattr(plan, \"allocations\"):\n        for a in plan.allocations:\n            allocs_by_sup[a.supplier_id] = allocs_by_sup.get(a.supplier_id, 0) + a.allocated_units\n            if \"EXPEDITED\" in a.shipping_mode:\n                air_by_sup[a.supplier_id] = air_by_sup.get(a.supplier_id, 0) + a.allocated_units\n            else:\n                std_by_sup[a.supplier_id] = std_by_sup.get(a.supplier_id, 0) + a.allocated_units\n\n    # Dynamic runway calculation\n    runway_val = 2.08\n    if inventory_df is not None and demand_df is not None:\n        try:\n            curr = float(inventory_df.iloc[0][\"current_stock\"])\n            daily = float(demand_df[\"demand_units\"].sum()) / max(1, demand_df[\"day\"].nunique())\n            runway_val = round(curr / max(1.0, daily), 2)\n        except Exception:\n            runway_val = 2.08\n\n    fig = go.Figure()\n\n    # Subtle Tactical Grid Coordinate Lines\n    for gy in [0.22, 0.50, 0.78]:\n        fig.add_trace(go.Scatter(\n            x=[-0.05, 1.05], y=[gy, gy], mode=\"lines\",\n            line=dict(color=\"#161D29\", width=1, dash=\"dot\"),\n            hoverinfo=\"none\", showlegend=False\n        ))\n    for gx in [0.14, 0.50, 0.86]:\n        fig.add_trace(go.Scatter(\n            x=[gx, gx], y=[0.05, 0.95], mode=\"lines\",\n            line=dict(color=\"#161D29\", width=1, dash=\"dot\"),\n            hoverinfo=\"none\", showlegend=False\n        ))\n\n    # Extract suppliers list from suppliers_df\n    sup_list = []\n    if suppliers_df is not None and not suppliers_df.empty:\n        sup_list = suppliers_df.to_dict(orient=\"records\")\n    else:\n        sup_list = [\n            {\"supplier_id\": \"SUP-A\", \"name\": \"Apex Microelectronics (Primary)\", \"daily_capacity\": 500},\n            {\"supplier_id\": \"SUP-B\", \"name\": \"Beacon Tech Solutions (Backup 1)\", \"daily_capacity\": 350},\n            {\"supplier_id\": \"SUP-C\", \"name\": \"Crestline Components (Backup 2)\", \"daily_capacity\": 300},\n            {\"supplier_id\": \"SUP-D\", \"name\": \"Delta Raw Forge (Chassis)\", \"daily_capacity\": 600}\n        ]\n\n    # Assign vertical positions to suppliers\n    n_sup = len(sup_list)\n    y_coords = np.linspace(0.82, 0.18, n_sup) if n_sup > 1 else [0.50]\n    \n    nodes = []\n    lane_annotations = []\n\n    for idx, s in enumerate(sup_list):\n        sid = s[\"supplier_id\"]\n        raw_name = s.get(\"supplier_name\", s.get(\"name\", sid))\n        sname = raw_name.split(\"(\")[0].strip()\n        y_pos = y_coords[idx]\n        is_disrupted = (sid == disrupted_supplier)\n        alloc_qty = allocs_by_sup.get(sid, 0)\n        daily_cap = s.get(\"daily_capacity\", 300)\n        \n        if is_disrupted:\n            # Disrupted Supplier Route to Plant (Red dashed line)\n            fig.add_trace(go.Scatter(\n                x=[0.14, 0.50], y=[y_pos, 0.50],\n                mode=\"lines\",\n                line=dict(color=\"#EF4444\", width=2.4, dash=\"dash\"),\n                hoverinfo=\"text\",\n                hovertext=f\"<b>PRIMARY VENDOR: {sname.upper()} ({sid}) -> PLANT ALPHA</b><br>Status: DISRUPTED OUTAGE<br>Flow: 0 Units/Day\",\n                showlegend=False\n            ))\n            # Midpoint lane annotation\n            mid_x = (0.14 + 0.50) / 2\n            mid_y = (y_pos + 0.50) / 2\n            lane_annotations.append(dict(\n                x=mid_x - 0.03, y=mid_y,\n                text=\"<b>[OUTAGE: 0 u]</b>\",\n                font=dict(color=\"#EF4444\", size=8.5, family=\"Inter\"),\n                showarrow=False,\n                bgcolor=\"rgba(28, 20, 30, 0.8)\",\n                bordercolor=\"#EF4444\", borderpad=2, borderwidth=1\n            ))\n            nodes.append({\n                \"id\": sid,\n                \"label\": f\"<b>{sname} ({sid})</b><br>SHUTDOWN [0 u/d]\",\n                \"x\": 0.14, \"y\": y_pos, \"sym\": \"circle-x\",\n                \"color\": \"#1C141E\", \"border\": \"#EF4444\", \"size\": 24,\n                \"desc\": f\"Disrupted Supplier: {sname} (Offline)\"\n            })\n        else:\n            # Active Backup Route to Plant\n            has_air = air_by_sup.get(sid, 0) > 0\n            has_std = std_by_sup.get(sid, 0) > 0\n            route_color = \"#A855F7\" if has_air else (\"#06B6D4\" if has_std else \"#475569\")\n            route_width = 3.6 if alloc_qty > 0 else 1.6\n            dash_style = \"solid\" if alloc_qty > 0 else \"dot\"\n            mode_desc = \"Air Expedited + Ground\" if (has_air and has_std) else (\"Air Expedited\" if has_air else (\"Standard Freight\" if has_std else \"Standby\"))\n            \n            fig.add_trace(go.Scatter(\n                x=[0.14, 0.50], y=[y_pos, 0.50],\n                mode=\"lines\",\n                line=dict(color=route_color, width=route_width, dash=dash_style),\n                hoverinfo=\"text\",\n                hovertext=f\"<b>BACKUP ROUTE: {sname.upper()} ({sid}) -> PLANT ALPHA</b><br>Mode: {mode_desc}<br>Allocated: {alloc_qty:,} Units<br>Capacity: {daily_cap} u/d\",\n                showlegend=False\n            ))\n            \n            # Midpoint lane annotation if allocated\n            if alloc_qty > 0:\n                mid_x = (0.14 + 0.50) / 2\n                mid_y = (y_pos + 0.50) / 2\n                badge_text = f\"<b>AIR: {alloc_qty:,} u</b>\" if has_air else f\"<b>STD: {alloc_qty:,} u</b>\"\n                lane_annotations.append(dict(\n                    x=mid_x - 0.03, y=mid_y,\n                    text=badge_text,\n                    font=dict(color=route_color, size=8.5, family=\"Inter\"),\n                    showarrow=False,\n                    bgcolor=\"rgba(15, 23, 42, 0.85)\",\n                    bordercolor=route_color, borderpad=2, borderwidth=1\n                ))\n\n            status_tag = f\"ALLOC: {alloc_qty:,} u\" if alloc_qty > 0 else f\"STANDBY ({daily_cap} u/d)\"\n            nodes.append({\n                \"id\": sid,\n                \"label\": f\"<b>{sname} ({sid})</b><br>{status_tag}\",\n                \"x\": 0.14, \"y\": y_pos, \"sym\": \"circle\",\n                \"color\": \"#1A1426\" if has_air else (\"#121F29\" if has_std else \"#0F172A\"),\n                \"border\": route_color, \"size\": 22,\n                \"desc\": f\"Supplier: {sname} ({daily_cap} u/d capacity)\"\n            })\n\n    # Outbound Fulfillment: Plant Alpha -> DC East (Tier 1 Priority 100%)\n    fig.add_trace(go.Scatter(\n        x=[0.50, 0.86], y=[0.50, 0.72],\n        mode=\"lines\",\n        line=dict(color=\"#10B981\", width=3.2),\n        hoverinfo=\"text\",\n        hovertext=\"<b>OUTBOUND: PLANT ALPHA -> DC EAST</b><br>Tier-1 Healthcare & Defense: 100% Guaranteed SLA<br>Zero Critical Backorders\",\n        showlegend=False\n    ))\n    lane_annotations.append(dict(\n        x=(0.50 + 0.86) / 2 + 0.03, y=(0.50 + 0.72) / 2,\n        text=\"<b>TIER-1: 100% SLA</b>\",\n        font=dict(color=\"#10B981\", size=8.5, family=\"Inter\"),\n        showarrow=False,\n        bgcolor=\"rgba(19, 33, 29, 0.85)\",\n        bordercolor=\"#10B981\", borderpad=2, borderwidth=1\n    ))\n\n    # Outbound Fulfillment: Plant Alpha -> DC West (Commercial Tier 2 & 3)\n    fill_rate_display = f\"{plan.fulfillment_rate:.1f}%\" if plan else \"95.5%\"\n    fig.add_trace(go.Scatter(\n        x=[0.50, 0.86], y=[0.50, 0.28],\n        mode=\"lines\",\n        line=dict(color=\"#38BDF8\", width=2.4),\n        hoverinfo=\"text\",\n        hovertext=f\"<b>OUTBOUND: PLANT ALPHA -> DC WEST</b><br>Tier-2 & Tier-3 Fulfillment: {fill_rate_display} Service Level\",\n        showlegend=False\n    ))\n    lane_annotations.append(dict(\n        x=(0.50 + 0.86) / 2 + 0.03, y=(0.50 + 0.28) / 2,\n        text=f\"<b>COMMERCIAL: {fill_rate_display}</b>\",\n        font=dict(color=\"#38BDF8\", size=8.5, family=\"Inter\"),\n        showarrow=False,\n        bgcolor=\"rgba(21, 27, 38, 0.85)\",\n        bordercolor=\"#38BDF8\", borderpad=2, borderwidth=1\n    ))\n\n    # Plant Alpha and Distribution Hub Nodes\n    nodes.extend([\n        {\n            \"id\": \"PLANT-A\",\n            \"label\": f\"<b>Assembly Plant Alpha</b><br>RUNWAY: {runway_val} DAYS\",\n            \"x\": 0.50, \"y\": 0.50, \"sym\": \"square\",\n            \"color\": \"#201A15\", \"border\": \"#F59E0B\", \"size\": 28,\n            \"desc\": \"Central Manufacturing Facility\"\n        },\n        {\n            \"id\": \"DC-EAST\",\n            \"label\": \"<b>DC East (Regional)</b><br>TIER-1 SLA: 100%\",\n            \"x\": 0.86, \"y\": 0.72, \"sym\": \"diamond\",\n            \"color\": \"#13211D\", \"border\": \"#10B981\", \"size\": 24,\n            \"desc\": \"Healthcare & Critical Infrastructure Hub\"\n        },\n        {\n            \"id\": \"DC-WEST\",\n            \"label\": f\"<b>DC West (Regional)</b><br>FILL: {fill_rate_display}\",\n            \"x\": 0.86, \"y\": 0.28, \"sym\": \"diamond\",\n            \"color\": \"#151B26\", \"border\": \"#38BDF8\", \"size\": 24,\n            \"desc\": \"Enterprise & Commercial Hub\"\n        }\n    ])\n\n    ndf = pd.DataFrame(nodes)\n    fig.add_trace(go.Scatter(\n        x=ndf[\"x\"], y=ndf[\"y\"],\n        mode=\"markers+text\",\n        marker=dict(\n            symbol=ndf[\"sym\"],\n            size=ndf[\"size\"],\n            color=ndf[\"color\"],\n            line=dict(color=ndf[\"border\"], width=2.5)\n        ),\n        text=ndf[\"label\"],\n        textposition=\"top center\",\n        textfont=dict(color=\"#F1F5F9\", size=9.2, family=\"Inter\"),\n        hoverinfo=\"text\",\n        hovertext=[f\"<b>{n['id']}</b><br>{n['desc']}\" for n in nodes],\n        showlegend=False\n    ))\n\n    # Echelon Column Labels\n    fig.add_annotation(x=0.14, y=0.99, text=\"<b>ECHELON 1: SUPPLIERS</b>\", showarrow=False, font=dict(color=\"#94A3B8\", size=10, family=\"Inter\"))\n    fig.add_annotation(x=0.50, y=0.99, text=\"<b>ECHELON 2: MANUFACTURING</b>\", showarrow=False, font=dict(color=\"#94A3B8\", size=10, family=\"Inter\"))\n    fig.add_annotation(x=0.86, y=0.99, text=\"<b>ECHELON 3: DISTRIBUTION</b>\", showarrow=False, font=dict(color=\"#94A3B8\", size=10, family=\"Inter\"))\n\n    # Add all lane annotations\n    for ann in lane_annotations:\n        fig.add_annotation(**ann)\n\n    # Symmetrical Legend Bar at Bottom\n    fig.add_annotation(\n        x=0.5, y=-0.06,\n        text=\"<span style='color:#EF4444;'>[OUTAGE] Disrupted Lane (0 Flow)</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span style='color:#A855F7;'>[AIR] Expedited Route</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span style='color:#06B6D4;'>[STD] Standard Freight</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span style='color:#F59E0B;'>[PLANT] Assembly Facility</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span style='color:#10B981;'>[DC-E] Healthcare Hub</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span style='color:#38BDF8;'>[DC-W] Commercial Hub</span>\",\n        showarrow=False,\n        font=dict(color=\"#94A3B8\", size=9.5, family=\"Inter\"),\n        xref=\"paper\", yref=\"paper\"\n    )\n\n    fig.update_layout(\n        height=380,\n        autosize=True,\n        margin=dict(l=15, r=15, t=25, b=35),\n        xaxis=dict(showgrid=False, zeroline=False, showticklabels=False, range=[-0.04, 1.04]),\n        yaxis=dict(showgrid=False, zeroline=False, showticklabels=False, range=[0.05, 1.05]),\n        plot_bgcolor=\"#080A0F\",\n        paper_bgcolor=\"#080A0F\"\n    )\n    return fig\n\ndef build_enterprise_timeline_fig(plan=None, scenario=None, inventory_df=None, demand_df=None):\n    \"\"\"\n    Symmetrical Gantt Chart dynamically rendering outage windows, buffer exhaustion point,\n    and actual supplier replenishment arrivals.\n    \"\"\"\n    disruption_days = scenario.duration_days if scenario else 7\n    disrupted_id = scenario.disrupted_supplier_id if scenario else \"SUP-A\"\n    \n    runout_val = 2.08\n    if inventory_df is not None and demand_df is not None:\n        try:\n            curr = float(inventory_df.iloc[0][\"current_stock\"])\n            daily = float(demand_df[\"demand_units\"].sum()) / max(1, demand_df[\"day\"].nunique())\n            runout_val = round(curr / max(1.0, daily), 2)\n        except Exception:\n            runout_val = 2.08\n\n    lanes = [\n        {\"Lane\": f\"Primary ({disrupted_id}) Outage\", \"Start\": 1, \"Duration\": disruption_days, \"Color\": \"#EF4444\", \"Label\": f\"{disruption_days} Days (Outage)\"}\n    ]\n\n    color_palette = [\"#A855F7\", \"#06B6D4\", \"#10B981\", \"#3B82F6\", \"#F59E0B\"]\n    if plan and hasattr(plan, \"allocations\") and plan.allocations:\n        for idx, a in enumerate(plan.allocations):\n            mode_tag = \"Air\" if \"EXPEDITED\" in a.shipping_mode else \"Std\"\n            c = \"#A855F7\" if \"EXPEDITED\" in a.shipping_mode else color_palette[(idx + 1) % len(color_palette)]\n            start_day = 1 if \"EXPEDITED\" in a.shipping_mode else 1\n            lanes.append({\n                \"Lane\": f\"{a.supplier_name.split()[0]} ({a.supplier_id}) {mode_tag}\",\n                \"Start\": start_day,\n                \"Duration\": a.lead_time_days,\n                \"Color\": c,\n                \"Label\": f\"{a.lead_time_days}d ({a.allocated_units:,}u -> Lands Day {a.arrival_day})\"\n            })\n    else:\n        lanes.extend([\n            {\"Lane\": \"Beacon (SUP-B) Air\", \"Start\": 1, \"Duration\": 2, \"Color\": \"#A855F7\", \"Label\": \"2 Days (700u Air -> Day 3)\"},\n            {\"Lane\": \"Crestline (SUP-C) Air\", \"Start\": 1, \"Duration\": 2, \"Color\": \"#06B6D4\", \"Label\": \"2 Days (600u Air -> Day 3)\"},\n            {\"Lane\": \"Crestline (SUP-C) Std\", \"Start\": 1, \"Duration\": 4, \"Color\": \"#10B981\", \"Label\": \"4 Days (900u Std -> Day 5)\"},\n            {\"Lane\": \"Beacon (SUP-B) Std\", \"Start\": 1, \"Duration\": 5, \"Color\": \"#3B82F6\", \"Label\": \"5 Days (1,050u Std -> Day 6)\"}\n        ])\n\n    fig = go.Figure()\n\n    for item in lanes:\n        fig.add_trace(go.Bar(\n            y=[item[\"Lane\"]],\n            x=[item[\"Duration\"]],\n            base=[item[\"Start\"]],\n            orientation=\"h\",\n            marker=dict(\n                color=item[\"Color\"],\n                line=dict(color=\"#0D1017\", width=1.5),\n                opacity=0.92\n            ),\n            text=item[\"Label\"],\n            textposition=\"inside\",\n            insidetextanchor=\"middle\",\n            textfont=dict(color=\"#F8FAFC\", size=9, family=\"Inter\"),\n            hoverinfo=\"text\",\n            hovertext=f\"<b>{item['Lane']}</b><br>Transit Window: Day {item['Start']} to Day {item['Start'] + item['Duration']}<br>Duration: {item['Duration']} Days\",\n            showlegend=False\n        ))\n\n    # Buffer exhaustion vertical line\n    fig.add_vline(\n        x=runout_val, line_dash=\"dash\", line_color=\"#EF4444\", line_width=1.8,\n        annotation_text=f\"Buffer Exhaustion (Day {runout_val})\",\n        annotation_position=\"top right\",\n        annotation_font=dict(color=\"#EF4444\", size=8.5, family=\"JetBrains Mono\")\n    )\n\n    fig.update_layout(\n        height=190,\n        autosize=True,\n        margin=dict(l=10, r=15, t=10, b=25),\n        xaxis=dict(\n            title=\"Planning Horizon (Days 1 to 14)\",\n            title_font=dict(color=\"#64748B\", size=9),\n            tickmode=\"linear\", tick0=1, dtick=1,\n            range=[0.5, 14.5],\n            showgrid=True, gridcolor=\"#18202D\",\n            tickfont=dict(color=\"#64748B\", size=8.5)\n        ),\n        yaxis=dict(\n            autorange=\"reversed\",\n            tickfont=dict(color=\"#CBD5E1\", size=9, family=\"Inter\"),\n            showgrid=False\n        ),\n        plot_bgcolor=\"#080A0F\",\n        paper_bgcolor=\"#080A0F\",\n        barmode=\"overlay\"\n    )\n    return fig\n\ndef build_enterprise_cost_donut_fig(fill_rate=95.7, total_cost=266361, plan=None):\n    \"\"\"\n    Symmetrical Category Donut Chart dynamically displaying landed cost breakdown.\n    \"\"\"\n    if plan and hasattr(plan, \"total_material_cost\"):\n        labels = [\"Material PO Spend\", \"Expedited Freight\", \"Buffer Holding\", \"Backorder Penalties\"]\n        values = [\n            max(0, plan.total_material_cost),\n            max(0, plan.total_freight_cost),\n            max(0, plan.total_holding_cost),\n            max(0, plan.total_backorder_penalty)\n        ]\n        total_cost = plan.total_landed_cost\n    else:\n        labels = [\"Material PO Spend\", \"Expedited Freight\", \"Buffer Holding\", \"Backorder Penalties\"]\n        values = [187700, 43650, 3250, 31761]\n\n    colors = [\"#A855F7\", \"#06B6D4\", \"#10B981\", \"#EF4444\"]\n\n    fig = go.Figure(data=[go.Pie(\n        labels=labels,\n        values=values,\n        hole=0.72,\n        marker=dict(colors=colors, line=dict(color=\"#0D1017\", width=2.5)),\n        textinfo=\"none\",\n        hoverinfo=\"label+value+percent\",\n        direction=\"clockwise\",\n        sort=False\n    )])\n\n    # Center stat annotation\n    fig.add_annotation(\n        text=f\"<b style='font-size:18px; color:#F8FAFC;'>${total_cost/1000:.1f}K</b><br><span style='font-size:8.5px; color:#94A3B8; text-transform:uppercase;'>Landed Cost</span>\",\n        x=0.5, y=0.5,\n        font=dict(family=\"Inter\"),\n        showarrow=False\n    )\n\n    fig.update_layout(\n        height=175,\n        autosize=True,\n        margin=dict(l=10, r=10, t=10, b=10),\n        showlegend=False,\n        plot_bgcolor=\"#0E121A\",\n        paper_bgcolor=\"#0E121A\"\n    )\n    return fig\n\ndef build_sparkline_risk_fig(inventory_df=None, demand_df=None, plan=None):\n    \"\"\"Area sparkline dynamically showing risk intensity across planning horizon.\"\"\"\n    x = list(range(1, 15))\n    if plan and hasattr(plan, \"stockout_duration_days\"):\n        stk = plan.stockout_duration_days\n
